name: Scorer Benchmark

# Visible in the Actions run list so the model set and scorer settings of a past
# benchmark can be read off without opening it.
run-name: "Scorers ${{ inputs.models || '(defaults)' }} | ctx ${{ inputs.num_ctx || vars.AI_ASSISTANT_MODEL_NUM_CTX || '65536' }} | num_predict ${{ inputs.num_predict || vars.AI_ASSISTANT_SCORER_NUM_PREDICT || '24000' }} | temp ${{ inputs.temperature || vars.AI_ASSISTANT_SCORER_TEMPERATURE || '0' }} | reasoning ${{ inputs.reasoning || vars.AI_ASSISTANT_SCORER_REASONING || 'modelfile' }} | think ${{ inputs.think || vars.AI_ASSISTANT_SCORER_THINK || 'unset' }}"

on:
  workflow_dispatch:
    inputs:
      models:
        description: >
          Comma-separated list of Ollama models to benchmark.
          Leave blank to use the defaults. Per-model think override: "model=value",
          or "model=none" to send no think field at all.
        required: false
        default: ''
      num_ctx:
        description: "Scorer context window. Blank = the production value (65536)."
        required: false
        type: string
      num_predict:
        description: "Scorer output cap. Blank = the production value (24000). Raise for reasoning scorers."
        required: false
        type: string
      temperature:
        description: "Scorer temperature. Blank = the production value (0). Do not raise for a ranking run -- scorer variance was the largest noise source in the review benchmark."
        required: false
        type: string
      think:
        description: >
          Default Ollama `think` for every model (true/false/low/medium/high).
          Per-model override: append =VALUE in the models list, e.g.
          "Qwen3-Coder-30B-imatrix:Q3_K_M, Qwen3.8-27B-imatrix:Q4_K_S=medium".
        required: false
        type: string
      reasoning:
        description: "Reasoning strength via system prompt (low/medium/high/xhigh). Blank = model's Modelfile."
        required: false
        type: string
      effort:
        description: "Anthropic only (claude-* scorers): output_config.effort — low/medium/high/xhigh/max. Blank = high."
        required: false
        type: string

env:
  # Internal Ollama instance (default for on-prem models).
  OLLAMA_URL: ${{ vars.AI_ASSISTANT_OLLAMA_URL }}
  # Hosted Ollama cloud — used automatically for any model tagged ':cloud'.
  OLLAMA_CLOUD_URL: https://ollama.com
  OLLAMA_API_KEY: ${{ vars.OLLAMA_API_KEY }}
  # Anthropic, for any model tagged 'claude-*'. The two strongest reviewers in
  # the model benchmark were claude-opus-5 and claude-sonnet-5, so a scorer
  # ranking that cannot include them is incomplete. Secret, never a variable.
  ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
  AI_ASSISTANT_SCORER_EFFORT: ${{ inputs.effort || vars.AI_ASSISTANT_SCORER_EFFORT || 'high' }}

  # Scorer call settings. Same variable NAMES and same defaults as the scoring step
  # in ai_code_review.yml, so a repo variable set once applies to both and this
  # benchmark cannot silently rank scorers under a config production never uses.
  # Dispatch inputs override for one-off experiments.
  AI_ASSISTANT_MODEL_NUM_CTX: ${{ inputs.num_ctx || vars.AI_ASSISTANT_MODEL_NUM_CTX || '65536' }}
  AI_ASSISTANT_SCORER_NUM_PREDICT: ${{ inputs.num_predict || vars.AI_ASSISTANT_SCORER_NUM_PREDICT || '24000' }}
  AI_ASSISTANT_SCORER_TEMPERATURE: ${{ inputs.temperature || vars.AI_ASSISTANT_SCORER_TEMPERATURE || '0' }}
  AI_ASSISTANT_SCORER_REASONING: ${{ inputs.reasoning || vars.AI_ASSISTANT_SCORER_REASONING }}
  # The persona production sends on every scoring request. Previously this file
  # hardcoded "You are a helpful assistant." while ai_code_review.yml sent the
  # standardised prompt, so the benchmark ranked scorers under a persona
  # production never uses. A scorer's persona measurably moves its output.
  AI_ASSISTANT_SCORER_SYSTEM_PROMPT: >-
    ${{ vars.AI_ASSISTANT_SCORER_SYSTEM_PROMPT || 'You are an expert computer programmer with an eye for detail, who loves to provide high quality answers.' }}
  AI_ASSISTANT_SCORER_THINK: ${{ inputs.think || vars.AI_ASSISTANT_SCORER_THINK }}

jobs:
  scorer-benchmark:
    runs-on: mra-ubuntu
    timeout-minutes: 480

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      # -----------------------------------------------------------------------
      # Run every candidate scorer against three synthetic reviews:
      #
      #   perfect  — auto-generated from ISSUES.md; names every planted bug
      #              explicitly.  A good scorer should return 70/70 Found.
      #
      #   null     — a positive review that mentions nothing specific.
      #              A good scorer should return 0/70 Found (all Missed).
      #
      #   decoy    — genuine findings for the Critical and Logic issues only,
      #              silent on the rest.  A good scorer credits those and nothing
      #              else; anything more is evidence borrowed from a neighbouring
      #              finding, which is the failure that inflated ten of the twenty
      #              scorecards in the model benchmark.
      #
      # Metrics:
      #   TPR   = Found / total  on the perfect review   (sensitivity)
      #   TNR   = Missed / total on the null review      (specificity)
      #   DSR   = share of the decoy's silent issues correctly declined
      #   Score = harmonic mean of all three, zero on any zero term
      #
      # NOTE ON WHAT THIS CAN AND CANNOT DO. Two scorers known to behave
      # differently on real reviews both scored 100/100/100 here. These tests
      # screen out a broken scorer; they do not rank good ones. Ranking needs
      # real, ambiguous prose -- the archived review.md files -- not generated text.
      # -----------------------------------------------------------------------
      - name: Run scorer benchmark
        env:
          MODELS_INPUT: ${{ github.event.inputs.models }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          python3 - <<'PYEOF'
          import hashlib, json, os, re, subprocess, sys, time
          from datetime import datetime
          from pathlib import Path

          # Same post-processing the production workflow applies, imported rather than
          # copied -- the previous copy-paste had drifted 1,236 chars behind.
          sys.path.insert(0, ".")
          from scorecard_tools import (
              _content_words,
              check_row_alignment,
              count_table_statuses,
              downgrade_self_declared_absent,
              drop_duplicate_ids,
              drop_unknown_ids,
              enforce_note_grounding,
              hedge_check,
              spot_check,
          )

          # ── Config ─────────────────────────────────────────────────────────
          # Chosen from the model benchmark results, and carrying the per-model
          # `think` settings that benchmark established. The small Qwen3.5 models
          # spend their entire token budget reasoning and return no content at all
          # unless think is explicitly false; the 27B models need medium.
          DEFAULT_MODELS = [
              "Qwen3-Coder-30B-imatrix:Q3_K_M=false",    # incumbent; has no thinking capability
              "Qwen3.8-27B-imatrix:Q4_K_S=medium",       # only local reviewer at 100% precision
              "Qwen3.5-9B-imatrix:Q4_K_S=false",         # best laptop-viable reviewer
              "Gemma-4-31B-it-imatrix:Q4_K_M",           # 97% precision, conservative grader
              "claude-sonnet-5",                          # joint-best reviewer, cheapest of the leaders
          ]

          # A single `think` value cannot serve a mixed list -- Qwen3-Coder-30B needs
          # none while Qwen3.8-27B needs medium or it returns no content at all. Entries
          # may therefore carry a per-model override as "model=think". '=' is the
          # separator because ':' already appears in every Ollama tag.
          DEFAULT_THINK = os.environ.get("AI_ASSISTANT_SCORER_THINK", "").strip()
          REASONING = os.environ.get("AI_ASSISTANT_SCORER_REASONING", "").strip()
          SYSTEM_PROMPT = (os.environ.get("AI_ASSISTANT_SCORER_SYSTEM_PROMPT") or "").strip()
          if SYSTEM_PROMPT.lower() == "none":
              SYSTEM_PROMPT = ""

          raw_input = os.environ.get("MODELS_INPUT", "").strip()
          _entries = [m.strip() for m in raw_input.split(",") if m.strip()] or DEFAULT_MODELS
          MODELS = []
          THINK_FOR = {}
          # An override of 'none' omits the think field entirely. An EMPTY override
          # cannot express that -- it falls back to DEFAULT_THINK -- which matters
          # once AI_ASSISTANT_SCORER_THINK is set repo-wide: sending think=medium to
          # a model without the capability is a hard error ("does not support
          # thinking"), not a silent no-op.
          for entry in _entries:
              name, _, override = entry.partition("=")
              name = name.strip()
              override = override.strip()
              MODELS.append(name)
              THINK_FOR[name] = "" if override.lower() == "none" else (override or DEFAULT_THINK)

          OLLAMA_URL  = os.environ.get("OLLAMA_URL")
          CLOUD_URL   = os.environ.get("OLLAMA_CLOUD_URL", "https://ollama.com").rstrip("/")
          API_KEY     = os.environ.get("OLLAMA_API_KEY", "").strip()
          ANTHROPIC_KEY = os.environ.get("ANTHROPIC_API_KEY", "").strip()
          EFFORT      = os.environ.get("AI_ASSISTANT_SCORER_EFFORT", "high").strip() or "high"
          RUN_NUMBER  = os.environ.get("RUN_NUMBER", "?")
          # Read through the same variable names ai_code_review.yml uses, with the
          # same defaults, so the two cannot drift apart the way the preamble did.
          NUM_CTX     = int(os.environ.get("AI_ASSISTANT_MODEL_NUM_CTX", "65536"))
          NUM_PREDICT = int(os.environ.get("AI_ASSISTANT_SCORER_NUM_PREDICT", "24000"))
          TEMPERATURE = float(os.environ.get("AI_ASSISTANT_SCORER_TEMPERATURE", "0"))

          OUT_DIR = Path("scorer_benchmark_results")
          # Derived from the review list rather than written out, so adding a review
          # type cannot leave its directory missing. The decoy runs did all their work
          # and then died writing the scorecard because decoy/ did not exist.
          REVIEW_TYPES = ("perfect", "null", "decoy")
          OUT_DIR.mkdir(exist_ok=True)
          for _rt in REVIEW_TYPES:
              (OUT_DIR / _rt).mkdir(exist_ok=True)

          print(f"Models to benchmark: {MODELS}")

          # ── Scoring preamble ────────────────────────────────────────────────
          # Read from the same file the production workflow uses. This was a
          # copy-paste of the literal and had silently fallen behind by the whole
          # 'HOW TO READ THE REVIEW' block, so the benchmark was ranking scorers
          # against instructions production no longer sends.
          PREAMBLE = Path("scorer_prompt.md").read_text(encoding="utf-8")
          # Line endings normalised so a Windows checkout and the Linux runner agree.
          PROMPT_SHA = hashlib.sha256(
              PREAMBLE.replace("\r\n", "\n").encode("utf-8")
          ).hexdigest()[:12]
          print(f"Scorer prompt: {len(PREAMBLE)} chars, SHA {PROMPT_SHA}")

          # ── Null review ─────────────────────────────────────────────────────
          # Deliberately vague — no specific file names, method names, or
          # vulnerability types.  A well-calibrated scorer should mark everything
          # Missed.  Any Found or Partial rating here is a false positive.
          NULL_REVIEW = (
              "# Code Review — SampleBankingApp\n\n"
              "The codebase was reviewed across all source files. "
              "The implementation follows standard .NET conventions and is structured clearly. "
              "No significant issues were identified. "
              "The code appears maintainable and consistent with the framework patterns in use.\n"
          )

          # ── Perfect review: auto-generated from ISSUES.md ───────────────────
          # Parses every table row and produces a review sentence that names the
          # specific file, symbol, and behaviour — giving the scorer unambiguous
          # evidence for every issue.  The UT row is appended as prose.
          def _strip_emphasis(text: str) -> str:
              """Drop **bold** / *italic* markers but leave `code spans` alone.

              The naive sub ate the operator out of `skip = page * pageSize`, quietly
              corrupting the one reference row whose entire point is that operator.
              """
              parts = re.split(r"(`[^`]*`)", text)
              for i in range(0, len(parts), 2):   # even indices sit outside backticks
                  parts[i] = re.sub(r"\*{1,2}([^*]*?)\*{1,2}", r"\1", parts[i])
              return "".join(parts).strip()

          # The decoy holds genuine findings for these prefixes only. Critical and
          # Logic are used because they are the issues every model finds, so a
          # scorer cannot fail the positive half for lack of ability -- any credit
          # it gives the remaining 54 is association, not recognition.
          DECOY_PREFIXES = ("C", "L")


          def build_perfect_review(issues_md: str, only_prefixes=None) -> str:
              row_re = re.compile(
                  r"^\|\s*([A-Z]{1,3}\d+)\s*"   # ID
                  r"\|\s*`([^`]+)`\s*"            # file (backtick-quoted)
                  r"\|\s*([^|]*?)\s*"             # lines
                  r"\|\s*(.+?)\s*\|?\s*$"         # description
              )
              cat_order = ["C", "L", "R", "E", "RL", "N", "M", "D", "A", "CF"]
              cat_names = {
                  "C":  "Security Vulnerabilities",
                  "L":  "Logic Errors",
                  "R":  "Refactoring Opportunities",
                  "E":  "Error Handling",
                  "RL": "Resource Leaks",
                  "N":  "Missing Null Checks",
                  "M":  "Magic Strings and Numbers",
                  "D":  "Dead Code",
                  "A":  "Anti-patterns",
                  "CF": "Configuration Issues",
              }
              findings: dict[str, list[str]] = {k: [] for k in cat_order}

              # Any table row opening with an issue ID. Compared against the rows the
              # strict regex actually parses, so a malformed reference row fails loudly
              # instead of yielding a 'perfect' review that is quietly one issue short.
              any_row = re.compile(r"^\|\s*([A-Z]{1,3}\d+)\s*\|")
              seen_ids, parsed_ids = [], []

              for raw in issues_md.splitlines():
                  stripped = raw.strip()
                  m_any = any_row.match(stripped)
                  if m_any:
                      seen_ids.append(m_any.group(1))
                  m = row_re.match(stripped)
                  if not m:
                      continue
                  parsed_ids.append(m.group(1))
                  issue_id, file_path, lines, desc = m.groups()
                  desc = _strip_emphasis(desc)
                  prefix = re.match(r"^([A-Z]{1,3})", issue_id).group(1)
                  if only_prefixes is not None and prefix not in only_prefixes:
                      continue
                  if prefix in findings:
                      line_ref = lines.strip()
                      # Markdown table row, matching the shape every real model review
                      # uses. The bullet form this replaced parsed to zero citations, so
                      # location-aware evidence could never fire on a synthetic review.
                      findings[prefix].append(
                          f"| {file_path} | {line_ref} | {desc} | Address as described. |"
                      )

              sections = ["# Code Review — SampleBankingApp\n",
                          "The following issues were identified during review of the full source tree.\n"]
              for prefix in cat_order:
                  rows = findings.get(prefix, [])
                  if not rows:
                      continue
                  sections.append(f"\n## {cat_names[prefix]}\n")
                  sections.append("| File | Line | Issue | Fix |")
                  sections.append("|------|------|-------|-----|")
                  sections.extend(rows)

              dropped = [i for i in seen_ids if i not in parsed_ids]
              if dropped:
                  print(
                      f"WARN: {len(dropped)} reference row(s) could not be parsed into the "
                      f"perfect review and will score as Missed for every model: "
                      f"{', '.join(dropped)}. Check the file column is backtick-quoted.",
                      file=sys.stderr,
                  )
              build_perfect_review.parsed = len(parsed_ids)
              build_perfect_review.seen = len(seen_ids)

              # The UT row is prose rather than a table row, so it is appended by hand --
              # but only for the full review. The decoy must not mention tests at all,
              # or UT stops being one of the 54 issues it is silent about.
              if only_prefixes is None:
                  sections.append(
                      "\n## Missing Unit Tests\n"
                      "\nThe project contains no test project and no test files of any kind. "
                      "AuthService.Login, AuthService.GenerateJwtToken, TransactionService.Transfer, "
                      "TransactionService.Deposit, UserService.GetUsersPage, StringHelper methods, "
                      "and all controller actions lack any test coverage whatsoever.\n"
                  )
              return "\n".join(sections)

          # Status counting comes from scorecard_tools too -- this file used to carry
          # its own near-identical copy, which is exactly the duplication that let the
          # scoring preamble drift.
          count_statuses = count_table_statuses

          # ── Ollama call ─────────────────────────────────────────────────────
          # Models tagged ':cloud' (e.g. glm-5.2:cloud) are served by the hosted
          # Ollama cloud and need a Bearer key; everything else goes to the
          # internal instance with no auth.
          def call_anthropic(model: str, prompt: str, system_text: str) -> tuple[str, dict]:
              """Anthropic Messages API. Mirrors the branch in ai_code_review.yml.

              temperature is deliberately NOT sent -- it is rejected on Opus 4.7 and
              later. Reasoning is controlled by output_config.effort instead, which
              is why Anthropic scorers cannot be pinned to temperature 0 the way the
              Ollama ones are.
              """
              if not ANTHROPIC_KEY:
                  raise RuntimeError(f"'{model}' needs ANTHROPIC_API_KEY, which is unset.")
              body = {
                  "model": model,
                  "max_tokens": NUM_PREDICT,
                  "messages": [{"role": "user", "content": prompt}],
                  "thinking": {"type": "adaptive", "display": "summarized"},
                  "output_config": {"effort": EFFORT},
              }
              if system_text:
                  body["system"] = system_text
              _t0 = time.monotonic()
              result = subprocess.run(
                  ["curl", "-s", "--show-error", "--fail-with-body", "--max-time", "7200",
                   "-X", "POST", "https://api.anthropic.com/v1/messages",
                   "-H", "Content-Type: application/json",
                   "-H", f"x-api-key: {ANTHROPIC_KEY}",
                   "-H", "anthropic-version: 2023-06-01",
                   "--data-binary", "@-"],
                  input=json.dumps(body).encode(), capture_output=True)
              if result.returncode != 0:
                  raise RuntimeError(
                      f"curl failed (exit {result.returncode})\n"
                      f"stderr: {result.stderr.decode()}\n"
                      f"body:   {result.stdout.decode()[:500]}")
              data = json.loads(result.stdout.decode())
              blocks = data.get("content") or []
              content = "".join(b.get("text", "") for b in blocks if b.get("type") == "text").strip()
              thinking = "".join(b.get("thinking", "") for b in blocks if b.get("type") == "thinking")
              usage = data.get("usage") or {}
              # Wall clock, because the Messages API reports no duration. This
              # INCLUDES the network round trip, where Ollama's total_duration does
              # not -- the honest figure for a hosted model, but not directly
              # comparable with a local one. Flagged in the summary.
              _elapsed = round(time.monotonic() - _t0, 1)
              _out_tok = usage.get("output_tokens", 0)
              metrics = {
                  "total_duration_s": _elapsed,
                  "output_tokens":    _out_tok,
                  "output_tps":       round(_out_tok / max(_elapsed, 0.001), 1),
                  "done_reason":      data.get("stop_reason", ""),
                  "thinking_chars":   len(thinking),
                  "content_chars":    len(content),
              }
              if not content:
                  raise RuntimeError(
                      f"empty content (stop_reason={data.get('stop_reason')}, "
                      f"thinking={len(thinking)} chars)")
              return content, metrics


          def call_ollama(model: str, prompt: str) -> tuple[str, dict]:
              # Case-insensitive, because the obvious thing to paste is the name used
              # by the archive files ("Claude-Opus-5") rather than the API id. Run #30
              # lost all three reviews to that: the branch was skipped, the request
              # went to Ollama, and Ollama 404'd on a model it has never heard of.
              if model.strip().lower().startswith("claude-"):
                  _sys = SYSTEM_PROMPT
                  if REASONING:
                      _sys = f"Reasoning strength: {REASONING}\n\n{_sys}".strip()
                  # Anthropic ids are lowercase; sending "Claude-Opus-5" 404s there too.
                  _id = model.strip().lower()
                  if _id != model.strip():
                      print(f"      (model id normalised to {_id})")
                  return call_anthropic(_id, prompt, _sys)

              is_cloud = model.strip().lower().endswith(":cloud")
              base_url = CLOUD_URL if is_cloud else OLLAMA_URL
              if is_cloud and not API_KEY:
                  raise RuntimeError(
                      f"'{model}' is a cloud model but OLLAMA_API_KEY is unset."
                  )

              # Same construction as ai_code_review.yml: reasoning is prepended to the
              # standard persona rather than replacing it with a different one.
              system_text = SYSTEM_PROMPT
              if REASONING:
                  system_text = f"Reasoning strength: {REASONING}\n\n{system_text}".strip()
              messages = []
              if system_text:
                  messages.append({"role": "system", "content": system_text})
              messages.append({"role": "user", "content": prompt})

              body = {
                  "model": model,
                  "messages": messages,
                  "stream": False,
                  "options": {
                      "temperature": TEMPERATURE,
                      "num_predict": NUM_PREDICT,
                      "num_ctx": NUM_CTX,
                  },
              }
              think = THINK_FOR.get(model, DEFAULT_THINK)
              # A think value the model cannot honour is a hard 400 that costs the whole
              # run, so drop it rather than let the request fail. 'false' is always safe
              # -- non-thinking models accept it -- so only the enabling values are checked.
              if think and think.lower() not in ("false",) and not is_cloud:
                  if not supports_thinking(model):
                      print(f"      (think={think} dropped: {model} has no thinking capability)")
                      think = ""
              if think:
                  _t = think.lower()
                  body["think"] = True if _t == "true" else False if _t == "false" else think
              payload = json.dumps(body).encode()

              curl_cmd = [
                  "curl", "-s", "--show-error", "--fail-with-body",
                  "--max-time", "7200",
                  "-X", "POST", f"{base_url}/api/chat",
                  "-H", "Content-Type: application/json",
              ]
              if is_cloud:
                  curl_cmd += ["-H", f"Authorization: Bearer {API_KEY}"]
              curl_cmd += ["--data-binary", "@-"]

              result = subprocess.run(curl_cmd, input=payload, capture_output=True)
              if result.returncode != 0:
                  raise RuntimeError(
                      f"curl failed (exit {result.returncode})\n"
                      f"stderr: {result.stderr.decode()}\n"
                      f"body:   {result.stdout.decode()[:500]}"
                  )

              data = json.loads(result.stdout.decode())
              _think = re.compile(r"<think>.*?</think>\s*", re.DOTALL | re.IGNORECASE)
              msg = data.get("message") or {}
              # Ollama >= 0.9 puts reasoning in message.thinking. Those tokens still count
              # against num_predict, so a reasoning scorer can spend its whole budget and
              # return empty content -- which would otherwise be counted as 0F/0P/0M and
              # reported as a catastrophically bad scorer rather than a harness failure.
              thinking = msg.get("thinking") or ""
              content = _think.sub("", msg.get("content", "")).strip()

              def ns(k): return round(data.get(k, 0) / 1e9, 1)
              def tps(tok, dur):
                  t = data.get(tok, 0); d = data.get(dur, 0)
                  return round(t / max(d / 1e9, 0.001), 1) if t and d else 0.0

              metrics = {
                  "total_duration_s": ns("total_duration"),
                  "output_tokens":    data.get("eval_count", 0),
                  "output_tps":       tps("eval_count", "eval_duration"),
                  "done_reason":      data.get("done_reason", ""),
                  "thinking_chars":   len(thinking),
                  "content_chars":    len(content),
              }
              if not content:
                  raise RuntimeError(
                      f"empty content (thinking={len(thinking)} chars, "
                      f"eval_count={data.get('eval_count')}, "
                      f"done_reason={data.get('done_reason')}). "
                      "If thinking is large, this scorer needs a bigger num_predict."
                  )
              return content, metrics

          _CAPS_CACHE = {}


          def supports_thinking(model: str) -> bool:
              """Ask Ollama whether this model advertises the 'thinking' capability.

              Sending think= to a model without it is a 400, not a no-op, so the whole
              run dies. Queried once per model and cached. On any failure the answer is
              True, which preserves whatever the operator asked for rather than
              silently changing the run because a metadata call did not come back.
              """
              if model in _CAPS_CACHE:
                  return _CAPS_CACHE[model]
              ok = True
              try:
                  r = subprocess.run(
                      ["curl", "-s", "--max-time", "30", "-X", "POST",
                       f"{OLLAMA_URL}/api/show",
                       "-H", "Content-Type: application/json",
                       "--data-binary", "@-"],
                      input=json.dumps({"model": model}).encode(), capture_output=True)
                  if r.returncode == 0:
                      caps = (json.loads(r.stdout.decode()) or {}).get("capabilities") or []
                      ok = "thinking" in caps
              except Exception:
                  pass
              _CAPS_CACHE[model] = ok
              return ok


          def fmt_s(secs):
              if secs >= 60:
                  return f"{int(secs // 60)}m {secs % 60:.0f}s"
              return f"{secs:.1f}s"

          def harmonic3(*vals) -> float:
              """Harmonic mean. Zero on any zero term, which is the point: a scorer
              that fails one of the three tests outright cannot be rescued by the
              other two."""
              if any(v is None for v in vals) or min(vals) <= 0:
                  return 0.0
              return round(len(vals) / sum(1.0 / v for v in vals), 1)

          # ── Load inputs ─────────────────────────────────────────────────────
          issues_md     = Path("ISSUES.md").read_text(encoding="utf-8")
          # Same normalisation as the review workflow, so a Windows checkout and the
          # Linux runner produce the same digest for identical content.
          ISSUES_SHA = hashlib.sha256(
              issues_md.replace("\r\n", "\n").encode("utf-8")
          ).hexdigest()[:12]
          BRANCH = os.environ.get("GITHUB_REF_NAME", "?")
          COMMIT = os.environ.get("GITHUB_SHA", "")[:7] or "?"
          perfect_review = build_perfect_review(issues_md)
          # Derived, not hardcoded: TPR against a fixed 70 under-reports every scorer
          # whenever a reference row fails to parse (CF9 did exactly that).
          TOTAL_ISSUES = build_perfect_review.seen + 1   # +1 for the aggregate UT row
          print(f"Reference issues: {build_perfect_review.seen} rows + UT = {TOTAL_ISSUES}; "
                f"{build_perfect_review.parsed} parsed into the perfect review")

          decoy_review = build_perfect_review(issues_md, only_prefixes=DECOY_PREFIXES)
          DECOY_IDS = {m.group(1) for m in re.finditer(r"^\|\s*([A-Z]{1,3}\d+)\s*\|",
                                                       issues_md, re.M)
                       if re.match(r"^([A-Z]{1,3})", m.group(1)).group(1) in DECOY_PREFIXES}

          # ISSUES.md records several defects twice under different categories --
          # C8/CF1 are both "secrets in source control", C9/CF3 are both
          # "ValidateLifetime = false". When the decoy names one half it describes the
          # other, so the twin is NOT silent and crediting it is correct. Detected
          # from the descriptions rather than hardcoded, so the exclusion tracks
          # ISSUES.md rather than going stale against it.
          _descs = {}
          for _line in issues_md.splitlines():
              _c = [x.strip() for x in _line.strip().strip("|").split("|")]
              if len(_c) >= 4 and re.fullmatch(r"[A-Z]{1,3}\d+", _c[0]):
                  _descs[_c[0]] = _c[-1]

          DECOY_TWINS = set()
          _pairs = []
          for _a in DECOY_IDS:
              for _b, _d in _descs.items():
                  if _b in DECOY_IDS or _a not in _descs:
                      continue
                  _wa, _wb = _content_words(_descs[_a]), _content_words(_d)
                  if len(_wa & _wb) / max(len(_wa | _wb), 1) >= 0.40:
                      DECOY_TWINS.add(_b)
                      _pairs.append(f"{_a}={_b}")

          DECOY_SILENT = TOTAL_ISSUES - len(DECOY_IDS) - len(DECOY_TWINS)
          print(f"Decoy review: covers {len(DECOY_IDS)} issues "
                f"({', '.join(sorted(DECOY_IDS))}); silent on {DECOY_SILENT}")
          if DECOY_TWINS:
              print(f"  excluded as duplicates of a covered issue: "
                    f"{', '.join(sorted(_pairs))}")

          # Save the synthetic reviews so they can be inspected in the artifact.
          (OUT_DIR / "perfect_review.md").write_text(perfect_review, encoding="utf-8")
          (OUT_DIR / "null_review.md").write_text(NULL_REVIEW, encoding="utf-8")
          (OUT_DIR / "decoy_review.md").write_text(decoy_review, encoding="utf-8")


          _ROW = re.compile(r"^\|\s*\*{0,2}([A-Z]{1,3}\d*|UT)\*{0,2}\s*\|")
          _ST = re.compile(r"\|\s*(Found|Partial|Missed)\s*\|", re.IGNORECASE)


          def status_by_id(md: str) -> dict:
              out = {}
              for line in md.splitlines():
                  mid, mst = _ROW.match(line.strip()), _ST.search(line)
                  if mid and mst:
                      out.setdefault(mid.group(1).upper(), mst.group(1).capitalize())
              return out

          print(f"\nPerfect review: {len(perfect_review)} chars, "
                f"{len(perfect_review.splitlines())} lines")

          # ── Benchmark loop ──────────────────────────────────────────────────
          # Everything needed to decide whether two runs are comparable. Recorded
          # once and written alongside the results so an archived file stands alone.
          RUN_CONFIG = {
              "run_number":        RUN_NUMBER,
              "harness_commit":    COMMIT,
              "branch":            BRANCH,
              "temperature":       TEMPERATURE,
              "num_ctx":           NUM_CTX,
              "num_predict":       NUM_PREDICT,
              "system_prompt":     SYSTEM_PROMPT or None,
              "reasoning":         REASONING or None,
              "effort":            EFFORT,
              "scorer_prompt_sha": PROMPT_SHA,
              "issues_sha":        ISSUES_SHA,
              "total_issues":      TOTAL_ISSUES,
              "decoy_ids":         sorted(DECOY_IDS),
              "decoy_twins":       sorted(DECOY_TWINS),
              "decoy_silent":      DECOY_SILENT,
              "perfect_chars":     len(perfect_review),
              "decoy_chars":       len(decoy_review),
          }

          all_results: list[dict] = []

          for model in MODELS:
              sep = "=" * 64
              _th = THINK_FOR.get(model, DEFAULT_THINK)
              print(f"\n{sep}\n  Model: {model}"
                    f"  [think={_th or '(unset)'}, "
                    f"reasoning={REASONING or '(model default)'}]\n{sep}")

              # Resolved rather than requested, so the run configuration block reports
              # what was actually sent. Run #18 recorded think=medium for a model that
              # cannot accept it.
              _req_think = THINK_FOR.get(model, DEFAULT_THINK)
              _eff_think = _req_think
              _mlow = model.strip().lower()
              if (_req_think and _req_think.lower() != "false"
                      and not _mlow.endswith(":cloud")
                      and not _mlow.startswith("claude-")
                      and not supports_thinking(model)):
                  _eff_think = ""
              result: dict = {"model": model,
                              "think": _eff_think or None,
                              "think_requested": _req_think or None,
                              "reasoning": REASONING or None}

              for review_name, review_text in [
                  ("perfect", perfect_review),
                  ("null",    NULL_REVIEW),
                  ("decoy",   decoy_review),
              ]:
                  prompt = (PREAMBLE + issues_md +
                            "\n\n---\n## AI Review Output\n\n" + review_text + "\n")

                  print(f"  → {review_name} review … ", end="", flush=True)
                  try:
                      content, metrics = call_ollama(model, prompt)
                      found, partial, missed = count_statuses(content)
                      total = found + partial + missed

                      # Production never ships the scorer's raw output -- it dedupes,
                      # drops Notes that cannot be matched to the review, and flags
                      # mis-credits. Report both so the ranking reflects the scorer as
                      # actually deployed, not just the model in isolation.
                      # The full production pipeline, in production order. Three of these
                      # were added after this file was last updated and each caught a real
                      # failure during the model sweep: an invented R4/R5 pair, two sheets
                      # with renumbered CF rows, and Partials whose own Notes conceded the
                      # review never mentioned the issue.
                      proc = drop_duplicate_ids(content)
                      proc, unknown_ids = drop_unknown_ids(proc, issues_md)
                      proc, downgrades = enforce_note_grounding(proc, review_text, "enforce")
                      proc, self_declared = downgrade_self_declared_absent(proc)
                      misaligned, missing_ids = check_row_alignment(proc, issues_md)
                      p_found, p_partial, p_missed = count_table_statuses(proc)
                      _rows, miscredits, _under, unsupported = spot_check(proc, review_text)
                      hedged = hedge_check(proc)
                      p_adjusted = p_found - len(miscredits)

                      trunc = "⚠ TRUNCATED" if metrics["done_reason"] == "length" else ""
                      _flags = []
                      if unknown_ids:  _flags.append(f"{len(unknown_ids)} invented-id")
                      if self_declared: _flags.append(f"{len(self_declared)} self-declared-absent")
                      if misaligned or missing_ids:
                          _flags.append(f"{len(misaligned) + len(missing_ids)} MISALIGNED")
                      if unsupported: _flags.append(f"{len(unsupported)} unsupported-partial")
                      print(f"{fmt_s(metrics['total_duration_s'])} | "
                            f"{metrics['output_tps']} t/s | "
                            f"raw {found}F/{partial}P/{missed}M of {total} | "
                            f"processed {p_adjusted}F "
                            f"({len(downgrades)} ungrounded, {len(miscredits)} mis-credit, "
                            f"{len(hedged)} hedged"
                            + (", " + ", ".join(_flags) if _flags else "")
                            + f") {trunc}")

                      # Save individual scorecard
                      safe = re.sub(r"[:/\\]", "_", model)
                      (OUT_DIR / review_name / f"{safe}_scorecard.md").write_text(
                          f"# Scorer: {model}\n"
                          f"# Review type: {review_name}\n\n"
                          + content,
                          encoding="utf-8",
                      )

                      result[review_name] = {
                          "found":            found,
                          "partial":          partial,
                          "missed":           missed,
                          "total":            total,
                          "processed_found":   p_adjusted,
                          "processed_partial": p_partial,
                          "processed_missed":  p_missed + len(miscredits),
                          "ungrounded":        len(downgrades),
                          "miscredits":        miscredits,
                          "hedged":            [h[0] for h in hedged],
                          "unknown_ids":       unknown_ids,
                          "self_declared":     [d[0] for d in self_declared],
                          "misaligned":        [m[0] for m in misaligned] + missing_ids,
                          "unsupported":       unsupported,
                          "output_tokens":    metrics["output_tokens"],
                          "total_duration_s": metrics["total_duration_s"],
                          "output_tps":       metrics["output_tps"],
                          "done_reason":      metrics["done_reason"],
                          "thinking_chars":   metrics["thinking_chars"],
                      }

                      # Decoy only: of the issues this review is SILENT about, how many
                      # did the scorer credit anyway? That count IS the credit-everything
                      # rate, measured directly rather than inferred from a suspicious
                      # zero-Partial sheet.
                      if review_name == "decoy":
                          st = status_by_id(proc)
                          hit = sum(1 for i in DECOY_IDS if st.get(i) == "Found")
                          false_credit = [i for i, v in st.items()
                                          if i not in DECOY_IDS and i not in DECOY_TWINS
                                          and v in ("Found", "Partial")]
                          result[review_name]["decoy_hit"] = hit
                          result[review_name]["decoy_false_credit"] = len(false_credit)
                          result[review_name]["decoy_false_ids"] = sorted(false_credit)
                          print(f"      decoy: {hit}/{len(DECOY_IDS)} genuine found, "
                                f"{len(false_credit)}/{DECOY_SILENT} credited without evidence")

                  except Exception as exc:
                      print(f"ERROR — {exc}")
                      result[review_name] = {"error": str(exc)}

              all_results.append(result)

              # Save incrementally so a crash doesn't lose earlier results. The config
              # travels with them: archived on its own, this file has to be enough to
              # tell whether it can be compared with another.
              (OUT_DIR / "results.json").write_text(
                  json.dumps({"config": RUN_CONFIG, "results": all_results}, indent=2),
                  encoding="utf-8",
              )

          # ── Summary report ──────────────────────────────────────────────────
          timestamp = datetime.now().strftime("%Y-%m-%d %H:%M")

          def tpr(r):
              p = r.get("perfect", {})
              return p.get("found", 0) / TOTAL_ISSUES * 100 if "error" not in p else None

          def tnr(r):
              n = r.get("null", {})
              return n.get("missed", 0) / TOTAL_ISSUES * 100 if "error" not in n else None

          def tpr_proc(r):
              p = r.get("perfect", {})
              return (p.get("processed_found", 0) / TOTAL_ISSUES * 100
                      if "error" not in p else None)

          def tnr_proc(r):
              n = r.get("null", {})
              return (n.get("processed_missed", 0) / TOTAL_ISSUES * 100
                      if "error" not in n else None)

          def decoy_specificity(r):
              """Of the issues the decoy is silent about, the share correctly declined.

              The direct measure of the credit-everything failure -- a scorer that
              spreads one real finding across neighbouring issues scores low here and
              nowhere else."""
              d = r.get("decoy", {})
              if "error" in d or "decoy_false_credit" not in d:
                  return None
              return (DECOY_SILENT - d["decoy_false_credit"]) / DECOY_SILENT * 100


          def decoy_recall(r):
              """Of the issues the decoy DOES name, the share the scorer found."""
              d = r.get("decoy", {})
              if "error" in d or "decoy_hit" not in d:
                  return None
              return d["decoy_hit"] / max(len(DECOY_IDS), 1) * 100


          def dsr(r):
              """The decoy term: recall and specificity together.

              Specificity alone rewarded silence. Qwen3-32B returned output that
              parsed to zero rows -- no Found, no Partial, no Missed -- so it had no
              false credits, scored 100% specificity and 100% overall while finding
              none of the 16 issues the decoy names."""
              rec, spec = decoy_recall(r), decoy_specificity(r)
              if rec is None or spec is None:
                  return None
              if rec <= 0 or spec <= 0:
                  return 0.0
              return round(2 * rec * spec / (rec + spec), 1)

          def ungrounded_total(r):
              """Notes across all three reviews that the review could not support.

              The discriminating number. A scorer that credits issues the review
              never mentions is caught here and nowhere else: grounding removes the
              rows before they reach the score, so the sheet looks clean while the
              scorer is not. Codestral-22B needed 49 corrections on the decoy and
              still scored 98.9%.
              """
              n = 0
              for k in REVIEW_TYPES:
                  d = r.get(k, {})
                  if "error" not in d:
                      n += d.get("ungrounded", 0)
              return n

          def score_proc(r):
              """None when any test did not report -- distinct from a genuine zero.

              Reporting an errored test as 0.0% put a scorer at rank 1 with 100%
              sensitivity, 100% specificity and a 0.0% score, which is three
              contradictory numbers on one row."""
              vals = (tpr_proc(r), tnr_proc(r), dsr(r))
              if any(v is None for v in vals):
                  return None
              return harmonic3(*vals)

          # Rank on the processed score: that is the scorer production actually ships.
          ranked = sorted(
              all_results,
              key=lambda r: score_proc(r) if score_proc(r) is not None else -1,
              reverse=True,
          )

          def trunc_flag(r, key):
              d = r.get(key, {})
              return "⚠️ Yes" if d.get("done_reason") == "length" else "No"

          lines = [
              "# Scorer Benchmark Summary",
              "",
              f"> **Run:** #{RUN_NUMBER} &nbsp;·&nbsp; **Generated:** {timestamp}",
              "",
              f"> Scorer prompt SHA `{PROMPT_SHA}` &nbsp;·&nbsp; num_ctx {NUM_CTX:,} "
              f"&nbsp;·&nbsp; num_predict {NUM_PREDICT:,} &nbsp;·&nbsp; temperature {TEMPERATURE}"
              + (f" &nbsp;·&nbsp; reasoning `{REASONING}`" if REASONING else ""),
              "",
              "## Methodology",
              "",
              "| Review | Purpose | Expected output |",
              "|--------|---------|-----------------|",
              f"| **Perfect** | Explicitly names every planted bug by file, symbol, and behaviour | All {TOTAL_ISSUES} Found |",
              f"| **Null** | Generic positive review — nothing specific mentioned | All {TOTAL_ISSUES} Missed |",
              f"| **Decoy** | Genuine findings for the {len(DECOY_IDS)} Critical and Logic issues only | "
              f"{len(DECOY_IDS)} Found, {DECOY_SILENT} Missed |",
              "",
              (f"{len(DECOY_TWINS)} further issues ({', '.join(sorted(DECOY_TWINS))}) are excluded from "
               "the silent set: ISSUES.md records them twice under different categories, so the decoy "
               "describes them via their twin and crediting them is correct."
               if DECOY_TWINS else ""),
              "",
              f"- **TPR** (sensitivity): Found / {TOTAL_ISSUES} on the perfect review",
              f"- **TNR** (specificity): Missed / {TOTAL_ISSUES} on the null review",
              f"- **Decoy (recall/spec)**: recall is the share of the {len(DECOY_IDS)} named issues the scorer "
              f"found; specificity is the share of the {DECOY_SILENT} silent ones it correctly declined. The "
              "Score combines them, because specificity alone rewards a scorer that credits nothing at all",
              "- **Score**: harmonic mean of all three — a scorer that aces one test but fails another is penalised, "
              "and any outright zero scores zero",
              "- **Ungrounded**: Notes across all three reviews that the review could not support. These are "
              "removed before scoring, so a high count does not lower the Score — but it is the number that "
              "separates a scorer which grades correctly from one that credits everything and relies on the "
              "harness to clean up after it",
              "",
              "The decoy test is the one that matters most in practice. `perfect` and `null` bracket the",
              "extremes, and a scorer passes both by being uniformly generous or uniformly strict. The decoy",
              f"supplies real evidence for {len(DECOY_IDS)} issues and none for the other {DECOY_SILENT}, so every credit",
              f"it awards beyond those {len(DECOY_IDS)} is produced by association with a nearby finding — the failure",
              "that inflated ten of the twenty review scorecards in the model benchmark.",
              "",
              "These tests do discriminate, but not always through the Score. Four scorers spanning 5GB to",
              "65GB all returned 99.5-100%, while Codestral-22B returned 98.9% having rated 65 of 70 issues",
              "Found on a decoy that names 16 — a difference visible only in the Ungrounded column. Read both.",
              "",
              "The production scorer is `Qwen3-Coder-30B-imatrix:Q3_K_M`. Qwen3.8-27B-imatrix:Q4_K_S",
              "was benchmarked as a replacement and matched it exactly (100/100/100), but is ~6x slower",
              "(201s against 30s on the perfect review) and summarises the Description column rather than",
              "reproducing it, so the incumbent was kept.",
              "",
              "## Ranked Results",
              "",
              "`raw` is the scorer's unmodified output. `processed` applies the same",
              "post-processing production does — duplicate removal, downgrading Notes that",
              "cannot be matched to the review, and mis-credit detection. Production ships",
              "`processed`, so that is the column to rank on.",
              "",
              "Times for `claude-*` scorers are wall clock and include the network round trip;",
              "Ollama figures are the server's own generation time and exclude it.",
              "",
              "| # | Model | TPR | TNR | Decoy (recall/spec) | Score | Ungrounded | False credits | Perfect time | Truncated? |",
              "|---|-------|----:|----:|-------------------:|------:|-----------:|--------------:|--------------|------------|",
          ]

          for rank, r in enumerate(ranked, 1):
              tp, np_, ds = tpr_proc(r), tnr_proc(r), dsr(r)
              if tp is None or np_ is None:
                  lines.append(
                      f"| {rank} | {r['model']} | ERROR | ERROR | ERROR | ERROR | — | — | — |")
                  continue
              p = r.get("perfect", {}); d = r.get("decoy", {})
              trunc = next((trunc_flag(r, k) for k in REVIEW_TYPES
                            if trunc_flag(r, k) != "No"), "No")
              fc = d.get("decoy_false_credit")
              sp = score_proc(r)
              ug = ungrounded_total(r)
              lines.append(
                  f"| {rank} | {r['model']} "
                  f"| {tp:.1f}% | {np_:.1f}% "
                  f"| {('%.0f%% / %.0f%%' % (decoy_recall(r), decoy_specificity(r))) if ds is not None else '—'} "
                  f"| {('**%.1f%%**' % sp) if sp is not None else '_incomplete_'} "
                  f"| {('**%d**' % ug) if ug > 5 else str(ug)} "
                  f"| {('%d / %d' % (fc, DECOY_SILENT)) if fc is not None else '—'} "
                  f"| {fmt_s(p.get('total_duration_s', 0))} "
                  f"| {trunc} |"
              )

          _empty = [(r["model"], k) for r in ranked for k in REVIEW_TYPES
                    if "error" not in r.get(k, {}) and r.get(k, {}).get("total", -1) == 0]
          if _empty:
              lines += [
                  "",
                  "> **A review produced no parseable rows.** "
                  + "; ".join(f"`{m}` on the {k} review" for m, k in _empty)
                  + ". The scorer returned output that contains no Found/Partial/Missed "
                  "table, so nothing could be counted. Treat its figures as void rather "
                  "than as a result -- this is a format failure, not a judgement.",
              ]

          _heavy = [(r["model"], ungrounded_total(r)) for r in ranked
                    if ungrounded_total(r) > 5]
          if _heavy:
              lines += [
                  "",
                  "> **Read the Ungrounded column before the Score.** "
                  + "; ".join(f"`{m}` needed {n} corrections" for m, n in _heavy)
                  + ". Those are rows the scorer rated Found or Partial with nothing in the review to "
                  "support them. Grounding removed them before they reached the score, so the score "
                  "looks healthy — but such a scorer is wholly dependent on that check holding, unlike "
                  "one that never credits an unsupported row in the first place.",
              ]

          lines += [
              "",
              "## Detail — Perfect Review (sensitivity)",
              "",
              "A good scorer should return close to 70 Found.",
              "Missed = issues the scorer failed to recognise despite being clearly stated.",
              "",
              "| Model | Found | Partial | Missed | Total | Time | Speed |",
              "|-------|-------|---------|--------|-------|------|-------|",
          ]
          for r in all_results:
              p = r.get("perfect", {})
              if "error" in p:
                  lines.append(f"| {r['model']} | — | — | — | ERROR | — | — |")
              else:
                  lines.append(
                      f"| {r['model']} | {p['found']} | {p['partial']} | {p['missed']} "
                      f"| {p['total']} | {fmt_s(p['total_duration_s'])} | {p['output_tps']} t/s |"
                  )

          lines += [
              "",
              "## Detail — Null Review (specificity)",
              "",
              "A good scorer should return 0 Found and 0 Partial.",
              "Found or Partial = false positives (the scorer invented matches that aren't there).",
              "",
              "| Model | Found | Partial | Missed | Total | Time | Speed |",
              "|-------|-------|---------|--------|-------|------|-------|",
          ]
          for r in all_results:
              n = r.get("null", {})
              if "error" in n:
                  lines.append(f"| {r['model']} | — | — | — | ERROR | — | — |")
              else:
                  lines.append(
                      f"| {r['model']} | {n['found']} | {n['partial']} | {n['missed']} "
                      f"| {n['total']} | {fmt_s(n['total_duration_s'])} | {n['output_tps']} t/s |"
                  )

          lines += [
              "",
              "## Detail — Decoy Review (discrimination)",
              "",
              f"The decoy names {len(DECOY_IDS)} issues explicitly and is silent on the other {DECOY_SILENT}.",
              f"A calibrated scorer returns {len(DECOY_IDS)} Found. Anything it credits among the other",
              f"{DECOY_SILENT} is a false credit — evidence borrowed from an unrelated finding.",
              "",
              "| Model | Genuine found | False credits | Falsely credited IDs |",
              "|-------|---------------|---------------|----------------------|",
          ]
          for r in all_results:
              d = r.get("decoy", {})
              if "error" in d:
                  # Show the reason. A bare "ERROR" sent us looking at the model when
                  # the fault was a missing output directory in this workflow.
                  lines.append(f"| {r['model']} | — | ERROR | `{d['error'][:110]}` |")
              else:
                  ids = d.get("decoy_false_ids", [])
                  shown = ", ".join(ids[:12]) + (" …" if len(ids) > 12 else "")
                  lines.append(
                      f"| {r['model']} | {d.get('decoy_hit', 0)} / {len(DECOY_IDS)} "
                      f"| **{d.get('decoy_false_credit', 0)} / {DECOY_SILENT}** "
                      f"| {shown or '—'} |")

          # ── Run configuration, one block per scorer ─────────────────────────
          # Mirrors the Run Configuration table at the foot of issues_scorecard.md.
          # Everything a reader needs to reproduce or challenge the numbers above.
          def _v(val, blank="(model default)"):
              s = "" if val is None else str(val).strip()
              return f"`{s}`" if s else blank

          for r in all_results:
              model = r["model"]
              is_anthropic = model.strip().lower().startswith("claude-")
              lines += [
                  "",
                  f"## Run Configuration — {model}",
                  "",
                  "Values as actually sent for this run. Blank sampler entries mean the",
                  "request omitted them, so the model's own Modelfile applied.",
                  "",
                  "| Setting | Value |",
                  "|---|---|",
                  f"| Scorer model | {_v(model, '(unknown)')} |",
                  f"| Ollama `think` | {_v(r.get('think'), '(unset)')}"
                  + (f" _(requested `{r['think_requested']}`, dropped: model has no thinking capability)_"
                     if r.get("think_requested") and not r.get("think") else "")
                  + " |",
                  f"| Reasoning strength (system prompt) | {_v(r.get('reasoning'))} |",
                  f"| System prompt | {_v(SYSTEM_PROMPT, '(none sent)')} |",
                  f"| Temperature | {'(not sent — rejected on Opus 4.7+)' if is_anthropic else _v(TEMPERATURE)} |",
                  "| top_p | (model default) |",
                  "| top_k | (model default) |",
                  f"| Effort (Anthropic only) | {_v(EFFORT) if is_anthropic else '(n/a)'} |",
                  f"| num_ctx | {_v(NUM_CTX)} |",
                  f"| num_predict | {_v(NUM_PREDICT)} |",
                  f"| Scorer prompt SHA-256 | {_v(PROMPT_SHA)} |",
                  f"| ISSUES.md SHA-256 | {_v(ISSUES_SHA)} |",
                  f"| Reference issues | {_v(TOTAL_ISSUES)} ({build_perfect_review.seen} rows + UT) |",
                  f"| Decoy coverage | {_v(len(DECOY_IDS))} issues named, {_v(DECOY_SILENT)} silent |",
                  f"| Branch / commit | {_v(f'{BRANCH} @ {COMMIT}')} |",
                  "",
                  "| Review | Output tokens | Duration | Stop reason | Thinking chars |",
                  "|---|---|---|---|---|",
              ]
              for rt in REVIEW_TYPES:
                  d = r.get(rt, {})
                  if "error" in d:
                      lines.append(f"| {rt} | — | — | **ERROR** | — |")
                  else:
                      lines.append(
                          f"| {rt} | {d.get('output_tokens', '—')} "
                          f"| {fmt_s(d.get('total_duration_s', 0))} "
                          f"| {d.get('done_reason') or '—'} "
                          f"| {d.get('thinking_chars', 0):,} |"
                      )

          summary_path = OUT_DIR / "summary.md"
          summary_path.write_text("\n".join(lines) + "\n", encoding="utf-8")
          print(f"\nSummary written to {summary_path}")
          PYEOF

      # -----------------------------------------------------------------------
      # Print the summary so it's visible in the Actions log without
      # downloading the artifact.
      # -----------------------------------------------------------------------
      - name: Print summary
        if: always()
        run: |
          echo "======================================================================"
          echo "  SCORER BENCHMARK SUMMARY"
          echo "======================================================================"
          cat scorer_benchmark_results/summary.md || echo "(summary not generated)"

      # -----------------------------------------------------------------------
      # Upload scorecards, synthetic reviews, and raw JSON as one artifact.
      # -----------------------------------------------------------------------
      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: scorer-benchmark-${{ github.run_number }}
          path: scorer_benchmark_results/
          retention-days: 90
