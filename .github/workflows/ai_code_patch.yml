name: AI Code Patch

# Visible in the Actions run list so a past run's three models and the patcher's
# sampler can be read off without opening it.
run-name: "Patch ${{ inputs.patcher_model }} | reviewer ${{ inputs.reviewer_model }} | scorer ${{ inputs.scorer_model || inputs.reviewer_model }} | patch temp ${{ inputs.patch_temperature || vars.AI_PATCH_MODEL_TEMPERATURE || '0.2' }} ctx ${{ inputs.patch_num_ctx || vars.AI_PATCH_MODEL_NUM_CTX || '65536' }}/${{ inputs.patch_num_predict || vars.AI_PATCH_MODEL_NUM_PREDICT || '40000' }} | think p=${{ inputs.patch_think || vars.AI_PATCH_MODEL_THINK || 'unset' }} r=${{ inputs.reviewer_think || vars.AI_ASSISTANT_MODEL_THINK || 'unset' }} s=${{ inputs.scorer_think || vars.AI_ASSISTANT_SCORER_THINK || 'unset' }}"

# Runs a specified coding-agent model against ISSUES.md as the fix spec,
# applies the patched files to a scratch mirror of SampleBankingApp/, then
# invokes the peer reviewer on the pristine tree (baseline) and the patched
# tree (post-patch) so we can compare how many seeded bugs the agent resolved.
#
# Nothing in the repository working tree is modified — the patched code is
# written to a temporary scratch directory and uploaded as an artifact.

on:
  workflow_dispatch:
    inputs:
      patcher_model:
        description: >
          Ollama model that produces the fix. Any model tag is accepted
          (on-prem or ':cloud'). Example: Qwen3.6-27B-imatrix:Q4_K_S
        required: true
        default: 'Qwen3.6-27B:Q4_K_S'
      reviewer_model:
        description: >
          Model used by the peer reviewer to grade the patched code.
          Should NOT be the same as the patcher (a model marking its
          own work is not an independent check).
        required: true
        default: 'gpt-oss:120b'
      scorer_model:
        description: >
          Model that maps the peer review onto ISSUES.md rows.
          Leave blank to reuse the reviewer model.
        required: false
        default: ''
      patch_temperature:
        description: "Temperature for PATCH GENERATION only. Blank = 0.2 (code should be near-deterministic)."
        required: false
        type: string
      patch_num_ctx:
        description: "Context window for patch generation. Blank = 65536."
        required: false
        type: string
      patch_num_predict:
        description: "Output cap for patch generation. Blank = 40000."
        required: false
        type: string
      patch_reasoning:
        description: "Patcher reasoning strength via system prompt (low/medium/high/xhigh). Blank = Modelfile."
        required: false
        type: string
      patch_think:
        description: "Patcher Ollama think (true/false/low/medium/high). Blank = unset."
        required: false
        type: string
      reviewer_think:
        description: "Reviewer Ollama think. Blank = unset. Qwen3.8-27B needs medium."
        required: false
        type: string
      scorer_think:
        description: "Scorer Ollama think. Blank = unset."
        required: false
        type: string
      patch_system_prompt:
        description: "System prompt for the PATCHER. Blank = the benchmark default. 'none' = send none."
        required: false
        type: string
      effort:
        description: "Anthropic only (claude-* roles): output_config.effort — low/medium/high/xhigh/max. Blank = high."
        required: false
        type: string
      skip_baseline:
        description: >
          Skip the baseline peer review (only score the patched tree).
          Use when you only care about how many bugs remain after patching.
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

permissions:
  contents: read

env:
  # On-prem Ollama used for any model tag NOT ending in ':cloud'.
  OLLAMA_URL: ${{ vars.AI_ASSISTANT_OLLAMA_URL }}
  # Hosted Ollama cloud — used automatically for ':cloud' model tags.
  OLLAMA_CLOUD_URL: https://ollama.com
  # Bearer token; sent ONLY to the cloud endpoint by resolve_endpoint().
  OLLAMA_API_KEY: ${{ vars.OLLAMA_API_KEY }}
  # Anthropic, for any 'claude-*' role. Secret, never a variable.
  ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

jobs:
  patch-and-review:
    runs-on: mra-ubuntu
    timeout-minutes: 240

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          # Use whichever branch the workflow was dispatched from, so per-branch
          # patcher/reviewer setups don't accidentally run stale code from main.
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Sanity-check inputs
        id: sanity
        run: |
          # Cloud models require an API key up-front.
          # Lower-cased before matching: the obvious thing to paste is the archive
          # display name ('Kimi-k3:Cloud', 'Claude-Opus-5'), and a case-sensitive
          # test sends those to the wrong provider with an opaque 404.
          NEEDS_KEY='false'; NEEDS_ANTHROPIC='false'
          for m in '${{ inputs.patcher_model }}' '${{ inputs.reviewer_model }}' '${{ inputs.scorer_model }}'; do
            lm=$(printf '%s' "$m" | tr '[:upper:]' '[:lower:]')
            case "$lm" in
              *:cloud)  NEEDS_KEY='true' ;;
              claude-*) NEEDS_ANTHROPIC='true' ;;
            esac
          done
          if [ "$NEEDS_KEY" = 'true' ] && [ -z "$OLLAMA_API_KEY" ]; then
            echo "::error::A ':cloud' model was requested but the OLLAMA_API_KEY repository variable is not set."
            exit 1
          fi
          if [ "$NEEDS_ANTHROPIC" = 'true' ] && [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::error::A 'claude-*' model was requested but the ANTHROPIC_API_KEY repository SECRET is not set."
            exit 1
          fi
          if [ '${{ inputs.patcher_model }}' = '${{ inputs.reviewer_model }}' ]; then
            echo "::warning::patcher_model and reviewer_model are the same — the review is not an independent check of the patch."
          fi

          # GitHub artifact names disallow: " : < > | * ? \ /  (and control chars).
          # Squash any of those to '-' so tags like 'Qwen3.6-27B:Q4_K_S' still work.
          SAFE_MODEL=$(printf '%s' '${{ inputs.patcher_model }}' | tr ':"<>|*?\\/' '-')
          echo "safe_patcher_model=${SAFE_MODEL}" >> "$GITHUB_OUTPUT"

      - name: Run patcher + peer review
        env:
          AI_PATCHER_MODEL: ${{ inputs.patcher_model }}
          AI_REVIEWER_MODEL: ${{ inputs.reviewer_model }}
          # Blank scorer input falls through to the reviewer model inside the script.
          AI_SCORER_MODEL: ${{ inputs.scorer_model }}
          AI_PATCH_SKIP_BASELINE: ${{ inputs.skip_baseline == 'true' && '1' || '0' }}
          AI_PATCH_OUTPUT_DIR: ${{ github.workspace }}/.ai-patch

          # The reviewer sub-run (scripts/ai_code_review.py) inherits this environment.
          # These use the SAME names and defaults as ai_code_review.yml, so a repo
          # variable set once applies everywhere and the three harnesses cannot drift --
          # these were previously hardcoded to 49152/24000 and had fallen two revisions
          # behind production, meaning patcher results were graded on a different
          # instrument from the review benchmark.
          AI_ASSISTANT_MODEL_NUM_CTX: ${{ vars.AI_ASSISTANT_MODEL_NUM_CTX || '65536' }}
          AI_ASSISTANT_MODEL_NUM_PREDICT: ${{ vars.AI_ASSISTANT_MODEL_NUM_PREDICT || '40000' }}
          AI_ASSISTANT_MODEL_TEMPERATURE: ${{ vars.AI_ASSISTANT_MODEL_TEMPERATURE || '0' }}
          AI_ASSISTANT_SCORER_NUM_PREDICT: ${{ vars.AI_ASSISTANT_SCORER_NUM_PREDICT || '24000' }}
          AI_ASSISTANT_SCORER_TEMPERATURE: ${{ vars.AI_ASSISTANT_SCORER_TEMPERATURE || '0' }}
          AI_ASSISTANT_SCORECARD_GROUNDING: ${{ vars.AI_ASSISTANT_SCORECARD_GROUNDING || 'enforce' }}

          # Reasoning for the reviewer and scorer sub-runs. Same names as
          # ai_code_review.yml, blank by default so each model's Modelfile applies.
          # scripts/ai_code_review.py previously hardcoded `"think": False`, which did
          # not just omit the control -- it actively disabled reasoning for every model
          # in this pipeline.
          # The standardised persona, sent on every request by all three roles --
          # the same value ai_code_review.yml uses. Without it the reviewer and
          # scorer fell back to each model's Modelfile, so a patched tree was
          # graded on a different instrument from the review benchmark and the
          # two could not be compared. 'none' opts out.
          AI_ASSISTANT_MODEL_SYSTEM_PROMPT: >-
            ${{ vars.AI_ASSISTANT_MODEL_SYSTEM_PROMPT || 'You are an expert computer programmer with an eye for detail, who loves to provide high quality answers.' }}
          AI_ASSISTANT_SCORER_SYSTEM_PROMPT: >-
            ${{ vars.AI_ASSISTANT_SCORER_SYSTEM_PROMPT || 'You are an expert computer programmer with an eye for detail, who loves to provide high quality answers.' }}
          AI_PATCH_MODEL_SYSTEM_PROMPT: >-
            ${{ inputs.patch_system_prompt || vars.AI_PATCH_MODEL_SYSTEM_PROMPT || 'You are an expert computer programmer with an eye for detail, who loves to provide high quality answers.' }}
          AI_ASSISTANT_EFFORT: ${{ inputs.effort || vars.AI_ASSISTANT_EFFORT || 'high' }}
          AI_ASSISTANT_MODEL_REASONING: ${{ vars.AI_ASSISTANT_MODEL_REASONING }}
          AI_ASSISTANT_MODEL_THINK: ${{ inputs.reviewer_think || vars.AI_ASSISTANT_MODEL_THINK }}
          AI_ASSISTANT_SCORER_REASONING: ${{ vars.AI_ASSISTANT_SCORER_REASONING }}
          AI_ASSISTANT_SCORER_THINK: ${{ inputs.scorer_think || vars.AI_ASSISTANT_SCORER_THINK }}

          # Patch GENERATION is deliberately separate: lower temperature, because code
          # wants determinism where a review wants coverage. The script previously fell
          # back to its own 49152/24000 defaults because the workflow never set these.
          AI_PATCH_MODEL_TEMPERATURE: ${{ inputs.patch_temperature || vars.AI_PATCH_MODEL_TEMPERATURE || '0.2' }}
          AI_PATCH_MODEL_NUM_CTX: ${{ inputs.patch_num_ctx || vars.AI_PATCH_MODEL_NUM_CTX || '65536' }}
          AI_PATCH_MODEL_NUM_PREDICT: ${{ inputs.patch_num_predict || vars.AI_PATCH_MODEL_NUM_PREDICT || '40000' }}
          AI_PATCH_MODEL_REASONING: ${{ inputs.patch_reasoning || vars.AI_PATCH_MODEL_REASONING }}
          AI_PATCH_MODEL_THINK: ${{ inputs.patch_think || vars.AI_PATCH_MODEL_THINK }}
        run: |
          python3 scripts/ai_code_patch.py

      - name: Print patch summary to workflow log
        if: always()
        run: |
          echo "======================================================================"
          echo "  PATCH + REVIEW SUMMARY"
          echo "======================================================================"
          if [ -f .ai-patch/patch_summary.md ]; then
            cat .ai-patch/patch_summary.md
          else
            echo "(no patch_summary.md — patcher likely failed before scoring)"
          fi
          echo ""
          echo "======================================================================"
          echo "  BASELINE SCORECARD"
          echo "======================================================================"
          if [ -f .ai-patch/baseline_review/issues_scorecard.md ]; then
            cat .ai-patch/baseline_review/issues_scorecard.md
          else
            echo "(baseline skipped or not produced)"
          fi
          echo ""
          echo "======================================================================"
          echo "  POST-PATCH SCORECARD"
          echo "======================================================================"
          if [ -f .ai-patch/post_patch_review/issues_scorecard.md ]; then
            cat .ai-patch/post_patch_review/issues_scorecard.md
          else
            echo "(post-patch scorecard not produced)"
          fi

      - name: Upload patch + review artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ai-patch-${{ steps.sanity.outputs.safe_patcher_model }}-${{ github.run_number }}
          path: |
            .ai-patch/patch_summary.md
            .ai-patch/patch_summary.json
            .ai-patch/patch_response.md
            .ai-patch/baseline_review/review.md
            .ai-patch/baseline_review/issues_scorecard.md
            .ai-patch/baseline_review/metrics.md
            .ai-patch/baseline_review/metrics.json
            .ai-patch/post_patch_review/review.md
            .ai-patch/post_patch_review/issues_scorecard.md
            .ai-patch/post_patch_review/metrics.md
            .ai-patch/post_patch_review/metrics.json
            .ai-patch/scratch/**
          if-no-files-found: warn
          retention-days: 90
