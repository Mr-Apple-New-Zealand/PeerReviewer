name: Jira Analyst Benchmark

# One model per run. Each run is short and independent, runs at the settings
# that suit that model, and fails alone. Results are copied into
# jira_analyst_results/<Model>/ and summarised from there. Runs queue behind
# each other on the single self-hosted runner, so they never share the GPU.
#
# Visible in the Actions run list so the model and settings of a past run can
# be read off without opening it.
run-name: "Jira analyst ${{ inputs.mode == 'calibrate-judge' && '(judge calibration)' || inputs.mode == 'rejudge' && format('(re-judge {0})', inputs.results_dir) || inputs.model }} | ctx ${{ inputs.num_ctx || '32768' }} | predict ${{ inputs.num_predict || '4096' }} | repeats ${{ inputs.repeats || '1' }}"

on:
  workflow_dispatch:
    inputs:
      model:
        description: >
          benchmark only: ONE Ollama tag. Optional think override as
          "model=value", or "model=none" to send no think field.
        required: false
        type: string
      mode:
        description: "benchmark = run one model; calibrate-judge = check the judge; rejudge = re-grade a saved run"
        required: false
        type: choice
        options: [benchmark, calibrate-judge, rejudge]
        default: benchmark
      results_dir:
        description: "rejudge only: a committed run folder holding results.json (e.g. jira_analyst_results/Qwen3-VL-32B-Instruct)"
        required: false
        type: string
      cases:
        description: "Comma-separated case ids (e.g. C01,C08). Blank = all."
        required: false
        type: string
      num_ctx:
        description: "Blank = 32768. Qwen3-VL: 49152. Never above the model's trained window."
        required: false
        type: string
      num_predict:
        description: "Blank = 4096. Thinking models: 16384. Qwen2.5-VL: 8192."
        required: false
        type: string
      temperature:
        description: "Blank = 0.3. Keep it the same across runs, or their scores are not comparable."
        required: false
        type: string
      repeats:
        description: "Runs per case. Blank = 1. Use 3 for anything you will decide on."
        required: false
        type: string
      judge:
        description: "Judge model. Blank = claude-sonnet-5. Any Ollama tag also works."
        required: false
        type: string
      judge_effort:
        description: "Anthropic judge only: low/medium/high/xhigh/max. Blank = high."
        required: false
        type: string

env:
  OLLAMA_URL: ${{ vars.AI_ASSISTANT_OLLAMA_URL }}
  OLLAMA_CLOUD_URL: https://ollama.com
  OLLAMA_API_KEY: ${{ vars.OLLAMA_API_KEY }}
  # The judge. The tickets are synthetic, so sending them to Anthropic exposes
  # no company data.
  ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

jobs:
  jira-benchmark:
    runs-on: mra-ubuntu
    timeout-minutes: 480

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      # All logic lives in scripts/jira_benchmark.py so a local run and a CI run
      # are the same code. Inputs arrive as env vars, not ${{ }} splices into
      # the script, so a model name cannot inject shell.
      - name: Run Jira analyst benchmark
        id: run
        env:
          MODEL: ${{ inputs.model }}
          MODE: ${{ inputs.mode || 'benchmark' }}
          CASES: ${{ inputs.cases }}
          NUM_CTX: ${{ inputs.num_ctx || '32768' }}
          NUM_PREDICT: ${{ inputs.num_predict || '4096' }}
          TEMPERATURE: ${{ inputs.temperature || '0.3' }}
          REPEATS: ${{ inputs.repeats || '1' }}
          JUDGE: ${{ inputs.judge || 'claude-sonnet-5' }}
          JUDGE_EFFORT: ${{ inputs.judge_effort || 'high' }}
          RESULTS_DIR: ${{ inputs.results_dir }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          args=(--num-ctx "$NUM_CTX" --num-predict "$NUM_PREDICT" --temperature "$TEMPERATURE"
                --repeats "$REPEATS" --judge "$JUDGE" --judge-effort "$JUDGE_EFFORT"
                --out jira_benchmark_results)
          if [ -n "$CASES" ]; then args+=(--cases "$CASES"); fi
          label="$MODE"
          case "$MODE" in
            benchmark)
              if [ -z "$MODEL" ]; then echo "::error::benchmark mode needs a model."; exit 1; fi
              if [[ "$MODEL" == *,* ]]; then
                echo "::error::One model per run. Start a separate run for each model."
                exit 1
              fi
              args+=(--models "$MODEL")
              label="${MODEL%%=*}" ;;
            calibrate-judge)
              args+=(--calibrate-judge) ;;
            rejudge)
              if [ ! -f "$RESULTS_DIR/results.json" ]; then
                echo "::error::results_dir '$RESULTS_DIR' has no results.json. Commit the results folder first."
                exit 1
              fi
              args+=(--rejudge "$RESULTS_DIR") ;;
          esac
          # Artifact names cannot contain ':' and similar, so the tag is slugged.
          echo "label=$(printf '%s' "$label" | sed 's/[^A-Za-z0-9._-]/_/g')" >> "$GITHUB_OUTPUT"
          python3 scripts/jira_benchmark.py "${args[@]}"

      # Upload first: the artifact's download URL only exists once the upload
      # has run, and the summary below links to it.
      - name: Upload benchmark results
        id: upload
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jira-benchmark-${{ github.run_number }}-${{ steps.run.outputs.label || 'run' }}
          path: jira_benchmark_results/
          retention-days: 90

      - name: Publish summary
        if: always()
        env:
          MODE: ${{ inputs.mode || 'benchmark' }}
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
        run: |
          f=jira_benchmark_results/summary.md
          if [ "$MODE" = "calibrate-judge" ]; then f=jira_benchmark_results/calibration.md; fi
          {
            if [ -n "$ARTIFACT_URL" ]; then
              echo "**[Download the full results]($ARTIFACT_URL)**: every analysis, judge verdict and results.json (kept 90 days)."
              if [ "$MODE" = "benchmark" ]; then
                echo
                echo "To keep this run, unzip it into \`jira_analyst_results/<Model>/\`."
              fi
              echo
            fi
            if [ -f "$f" ]; then cat "$f"; else echo "(no summary generated)"; fi
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -f "$f" ]; then cat "$f"; fi
          echo "Download: ${ARTIFACT_URL:-(no artifact uploaded)}"
