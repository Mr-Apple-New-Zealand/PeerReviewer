name: AI Code Review

# Shown in the Actions run list instead of the workflow name, so the exact
# configuration of a past run is visible without opening it or downloading the
# artifact. Mirrors the env defaults below -- keep the two in step.
run-name: "Review ${{ inputs.model || vars.AI_ASSISTANT_OLLAMA_MODEL || 'Muse-Glimmer-30B-imatrix:Q4_K_S' }} | ctx ${{ inputs.num_ctx || vars.AI_ASSISTANT_MODEL_NUM_CTX || '65536' }}/${{ inputs.num_predict || vars.AI_ASSISTANT_MODEL_NUM_PREDICT || '40000' }} | temp ${{ inputs.temperature || vars.AI_ASSISTANT_MODEL_TEMPERATURE || '0.3' }} | reasoning ${{ inputs.reasoning || vars.AI_ASSISTANT_MODEL_REASONING || 'modelfile' }} | think ${{ inputs.think || vars.AI_ASSISTANT_MODEL_THINK || 'unset' }} | effort ${{ inputs.effort || vars.AI_ASSISTANT_MODEL_EFFORT || 'high' }} | top_p ${{ inputs.top_p || vars.AI_ASSISTANT_MODEL_TOP_P || 'modelfile' }} | top_k ${{ inputs.top_k || vars.AI_ASSISTANT_MODEL_TOP_K || 'modelfile' }}"

on:
  workflow_dispatch:
    inputs:
      model:
        description: "Ollama model tag, e.g. Qwen3.5-9B-imatrix:Q4_K_S (blank = repo default)"
        required: false
        type: string
      num_ctx:
        description: "Context window (num_ctx). Blank = 65536 (benchmark default). Lower only if VRAM-bound."
        required: false
        type: string
      num_predict:
        description: "Output token cap (num_predict). Blank = 40000 (benchmark default). Raise num_ctx with it."
        required: false
        type: string
      reasoning:
        description: "Reasoning strength via system prompt (low/medium/high/xhigh). Blank = model's Modelfile."
        required: false
        type: string
      think:
        description: "Ollama think field for Qwen3-family models (true/false/low/medium/high). Blank = unset."
        required: false
        type: string
      temperature:
        description: "Temperature: (0.3=benchmark default). Small Qwen3.5 variants used 0.6."
        required: false
        type: string
      effort:
        description: "Anthropic only (claude-* models): output_config.effort — low/medium/high/xhigh/max. Blank = high."
        required: false
        type: string
      system_prompt:
        description: "System prompt sent to the review model. Blank = the benchmark default. 'none' = send none (model's own Modelfile applies)."
        required: false
        type: string
      top_p:
        description: "top_p: Blank = use the model's own Modelfile value. Leave blank for benchmark runs."
        required: false
        type: string
      top_k:
        description: "top_k: Blank = use the model's own Modelfile value. Leave blank for benchmark runs."
        required: false
        type: string

permissions:
  contents: read

env:
  # On-prem Ollama used for any model tag NOT ending in ':cloud'.
  OLLAMA_URL: ${{ vars.AI_ASSISTANT_OLLAMA_URL }}
  # Hosted Ollama cloud — used automatically for ':cloud' model tags. Kept
  # identical to ai_code_patch.yml and scorer_benchmark.yml.
  OLLAMA_CLOUD_URL: https://ollama.com
  # Bearer token; sent ONLY to the cloud endpoint by resolve_endpoint().
  OLLAMA_API_KEY: ${{ vars.OLLAMA_API_KEY }}
  # Anthropic Messages API — used for any model tag starting 'claude-'. The
  # REVIEW step only; the scorer always stays on Ollama so scores remain
  # comparable across the cohort.
  ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
  # output_config.effort for claude-* models. Ignored by Ollama models, which
  # use AI_ASSISTANT_MODEL_THINK / _REASONING instead. 'high' is the API
  # default; 'xhigh' is Anthropic's recommendation for coding/agentic work.
  AI_ASSISTANT_MODEL_EFFORT: ${{ inputs.effort || vars.AI_ASSISTANT_MODEL_EFFORT || 'high' }}
  # ---------------------------------------------------------------------------
  # Per-run knobs. Precedence: workflow_dispatch input > repo variable > default.
  # These are job-level and authoritative -- do NOT redeclare any of them in a step's
  # own env block, because step-level env silently overrides job-level (that bug
  # defeated the run #134 sampler experiment).
  # ---------------------------------------------------------------------------
  OLLAMA_MODEL: ${{ inputs.model || vars.AI_ASSISTANT_OLLAMA_MODEL || 'Muse-Glimmer-30B-imatrix:Q4_K_S' }}
  # Token budgets. These two are coupled: the source listing sent to the model is
  # budgeted as (num_ctx - num_predict - 500) * 2.5 chars, so raising num_predict on its
  # own SHRINKS the codebase the model sees, silently and without an error. Measured on
  # run #137: 49152/40000 would have truncated the source AND overflowed the window.
  #
  # 65536/40000 is the uniform benchmark setting. It satisfies Qwen3.8-27B, which will
  # not emit any content at a lower budget (SUMMARY finding 7), so there is no longer a
  # per-model exception. Headroom at these values: 55,691 chars of source budget against
  # a 34,694-char payload, and 50,469 tokens needed against a 65,536 window.
  #
  # Output has grown 6,743 -> 9,628 -> 15,315 tokens as the prompt got more exhaustive;
  # 24000 was not yet binding but had little margin left.
  #
  # VRAM canary: every run so far held 39.8-40.0 tok/s against the Modelfile's 41.52 TPS
  # benchmark, i.e. fully GPU-resident. 49152 -> 65536 is +33% KV cache. If output speed
  # drops materially below ~40 tok/s, layers spilled to CPU -- drop to 57344/40000.
  AI_ASSISTANT_MODEL_NUM_CTX: ${{ inputs.num_ctx || vars.AI_ASSISTANT_MODEL_NUM_CTX || '65536' }}
  AI_ASSISTANT_MODEL_NUM_PREDICT: ${{ inputs.num_predict || vars.AI_ASSISTANT_MODEL_NUM_PREDICT || '40000' }}

  # Temperature: benchmark default 0.3. Muse-Glimmer's card recommends 1.0; run #134
  # tested that and scored 53 vs 54 at 0.3 -- inside the +/-4 run-to-run spread later
  # measured between two identical runs, so treat it as "no evidence either way" and
  # keep the benchmark default.
  AI_ASSISTANT_MODEL_TEMPERATURE: ${{ inputs.temperature || vars.AI_ASSISTANT_MODEL_TEMPERATURE || '0.3' }}

  # Reasoning effort. Two mechanisms because models differ, and BOTH are blank by
  # default so every model keeps whatever its own Modelfile declares:
  #   reasoning -> sends a "Reasoning strength: <level>" system message. This is how
  #                Muse-Glimmer-30B is controlled; its Modelfile bakes in "high".
  #   think     -> sets Ollama's top-level `think` field, used by Qwen3-family models
  #                (SUMMARY finding 7: Qwen3.8-27B needs think=medium to emit content).
  # Setting `reasoning` REPLACES the model's entire Modelfile SYSTEM block, so the
  # assistant line is reproduced alongside the level.
  AI_ASSISTANT_MODEL_REASONING: ${{ inputs.reasoning || vars.AI_ASSISTANT_MODEL_REASONING }}
  AI_ASSISTANT_MODEL_THINK: ${{ inputs.think || vars.AI_ASSISTANT_MODEL_THINK }}

  # System prompt, sent with EVERY review request. This is the fleet-wide control
  # for the persona -- it exists here rather than in each model's Modelfile
  # because:
  #   * a request system message REPLACES the Modelfile SYSTEM on Ollama, so this
  #     wins regardless of what any individual model was built with;
  #   * ':cloud' models have no Modelfile at all, and Anthropic models are not
  #     Ollama models -- neither could be standardised any other way;
  #   * it is version-controlled and diffable, and gets recorded in the scorecard,
  #     whereas a Modelfile SYSTEM appears nowhere in the artefact.
  # Before this existed the fleet ran a mix of personas ("/no_think Be concise"
  # on the Qwen3.x builds, an engineer persona on Qwen3-Coder-30B, nothing on
  # Gemma-4-31B), invisibly confounding every cross-model comparison.
  #
  # Set to the literal string 'none' to send no system message at all and fall
  # back to each model's own Modelfile -- the pre-standardisation behaviour.
  AI_ASSISTANT_MODEL_SYSTEM_PROMPT: >-
    ${{ inputs.system_prompt || vars.AI_ASSISTANT_MODEL_SYSTEM_PROMPT || 'You are an expert computer programmer with an eye for detail, who loves to provide high quality answers.' }}

  # top_p / top_k: DELIBERATELY BLANK by default. Each model ships its own card-tuned
  # values in its Modelfile, and Ollama applies those when the request omits them.
  # Hardcoding one model's sampler here silently forces it onto every other model and
  # invalidates cross-model comparison -- set these only for a single-model experiment.
  AI_ASSISTANT_MODEL_TOP_P: ${{ inputs.top_p || vars.AI_ASSISTANT_MODEL_TOP_P }}
  AI_ASSISTANT_MODEL_TOP_K: ${{ inputs.top_k || vars.AI_ASSISTANT_MODEL_TOP_K }}

jobs:
  code-review:
    # REQUIRED: must use a self-hosted runner that can reach 192.168.10.100
    # Add additional labels (e.g. [self-hosted, linux]) to target a specific runner
    runs-on: mra-ubuntu
    timeout-minutes: 180

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          # Use whichever branch the workflow was dispatched from, matching
          # ai_code_patch.yml. This previously pinned `main`, which checked out the
          # source AND the harness from main while GitHub ran the YAML from the
          # dispatching ref -- so branch-side changes to ISSUES.md, scorer_prompt.md
          # or scorecard_tools.py silently never took effect, and the commit recorded
          # in each scorecard did not describe the code actually reviewed.
          ref: ${{ github.ref }}
          fetch-depth: 0

      # -----------------------------------------------------------------------
      # Collect every tracked source file on the branch into a single document
      # so the model reviews the full codebase, not just what changed.
      # -----------------------------------------------------------------------
      - name: Resolve run identity
        id: cfg
        run: |
          # GitHub artifact names disallow: " : < > | * ? \ /  — squash them so a tag
          # like 'Qwen3.6-27B:Q4_K_S' survives into the filename.
          SAFE_MODEL=$(printf '%s' "$OLLAMA_MODEL" | tr ':"<>|*?\\/' '-')
          echo "safe_model=${SAFE_MODEL}" >> "$GITHUB_OUTPUT"
          echo "Model under test: $OLLAMA_MODEL  (artifact slug: ${SAFE_MODEL})"

          # Cloud models need an API key. resolve_endpoint() would also catch this,
          # but the SCORER is not resolved until after a multi-minute review has
          # already run -- so check both models up front. Mirrors ai_code_patch.yml.
          NEEDS_KEY='false'
          for m in "$OLLAMA_MODEL" '${{ vars.AI_ASSISTANT_OLLAMA_MODEL_REVIEWER }}'; do
            case "$m" in *:cloud) NEEDS_KEY='true' ;; esac
          done
          if [ "$NEEDS_KEY" = 'true' ] && [ -z "$OLLAMA_API_KEY" ]; then
            echo "::error::A ':cloud' model was requested but the OLLAMA_API_KEY repository variable is not set."
            exit 1
          fi

          # Anthropic models need their own key. Same fail-fast reasoning: better
          # here than after the source listing has been collected.
          case "$OLLAMA_MODEL" in
            claude-*)
              if [ -z "$ANTHROPIC_API_KEY" ]; then
                echo "::error::Model '$OLLAMA_MODEL' is an Anthropic model but the ANTHROPIC_API_KEY secret is not set."
                exit 1
              fi
              echo "Anthropic model detected — the review runs against api.anthropic.com; the scorer stays on Ollama."
              ;;
          esac

      - name: Collect branch source files
        id: diff
        run: |
          git ls-files -- 'SampleBankingApp/' \
            | grep -E '\.(cs|json|csproj|yml|yaml|config|xml|html|css|js|ts|md)$' \
            | grep -v -E '(\.min\.js|\.min\.css|package-lock\.json|yarn\.lock|\.lock|\.sum)$' \
            > file_list.txt

          : > branch_content.txt
          while IFS= read -r file; do
            echo "### File: $file" >> branch_content.txt
            echo '```' >> branch_content.txt
            nl -ba "$file" >> branch_content.txt
            echo '```' >> branch_content.txt
            echo "" >> branch_content.txt
          done < file_list.txt

          CONTENT_SIZE=$(wc -c < branch_content.txt)
          echo "diff_size=${CONTENT_SIZE}" >> "$GITHUB_OUTPUT"

          if [ "$CONTENT_SIZE" -eq 0 ]; then
            echo "empty=true" >> "$GITHUB_OUTPUT"
          else
            echo "empty=false" >> "$GITHUB_OUTPUT"
            echo "Collected $(wc -l < file_list.txt) files (${CONTENT_SIZE} bytes)"
          fi

      - name: Debug prompt size
        if: steps.diff.outputs.empty == 'false'
        run: |
          CHARS=$(wc -c < branch_content.txt)
          WORDS=$(wc -w < branch_content.txt)
          # Mirror the review step budget: (num_ctx - num_predict - 500 safety) * 2.5
          # chars/token, before the ~7.5k chars of instruction overhead it also subtracts.
          BUDGET=$(( (AI_ASSISTANT_MODEL_NUM_CTX - AI_ASSISTANT_MODEL_NUM_PREDICT - 500) * 5 / 2 ))
          echo "Content: ${CHARS} chars, ${WORDS} words"
          echo "num_ctx=${AI_ASSISTANT_MODEL_NUM_CTX} num_predict=${AI_ASSISTANT_MODEL_NUM_PREDICT}"
          echo "Source char budget, before instruction overhead: ${BUDGET}"
          echo "Conservative token estimate (chars / 2.5): $(( CHARS * 2 / 5 ))"
          echo "Payload will be truncated: $([ $CHARS -gt $BUDGET ] && echo YES || echo NO)"

            
      - name: Skip if no relevant changes
        if: steps.diff.outputs.empty == 'true'
        run: echo "No reviewable changes on this branch — skipping AI review."

      # -----------------------------------------------------------------------
      # Send the diff to Ollama and save the review to review.txt
      # -----------------------------------------------------------------------
      - name: Request review from Ollama
        if: steps.diff.outputs.empty == 'false'
        env:
          AI_ASSISTANT_MODEL_PROMPT: ${{ vars.AI_ASSISTANT_MODEL_PROMPT }}
          BRANCH_NAME: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          python3 - <<'PYEOF'
          import hashlib, json, os, subprocess, sys, time

          branch_name = os.environ.get("BRANCH_NAME", "(unknown branch)")
          commit_sha = os.environ.get("COMMIT_SHA", "(unknown commit)")
          model = (os.environ.get("OLLAMA_MODEL") or "").strip()

          def resolve_endpoint(m):
              """Pick the Ollama base URL + API key for a model tag.

              The tag is the only signal: a ':cloud' suffix routes to
              OLLAMA_CLOUD_URL with OLLAMA_API_KEY as a Bearer token; anything
              else goes to on-prem OLLAMA_URL with NO auth header, because local
              Ollama rejects Authorization with 400. Fails loudly rather than
              silently sending a local request to the cloud or vice versa.

              Mirrors resolve_endpoint() in scripts/ai_code_review.py -- keep the
              two in step.
              """
              cloud_url = os.environ.get("OLLAMA_CLOUD_URL", "https://ollama.com").strip().rstrip("/")
              onprem_url = os.environ.get("OLLAMA_URL", "").strip().rstrip("/")
              api_key = os.environ.get("OLLAMA_API_KEY", "").strip() or None
              if m.endswith(":cloud"):
                  if not cloud_url:
                      print(f"ERROR: Model '{m}' is a cloud model but OLLAMA_CLOUD_URL is empty.", file=sys.stderr)
                      sys.exit(1)
                  if not api_key:
                      print(f"ERROR: Model '{m}' requires OLLAMA_API_KEY to be set.", file=sys.stderr)
                      sys.exit(1)
                  return cloud_url, api_key
              if not onprem_url:
                  print(f"ERROR: Model '{m}' is a local model but OLLAMA_URL is not set.", file=sys.stderr)
                  sys.exit(1)
              return onprem_url, None

          # Anthropic models are routed by tag prefix, exactly as ':cloud' is
          # routed by suffix. This branch applies to the REVIEW ONLY -- the scoring
          # step below always resolves through Ollama, so the measuring instrument
          # is identical whichever model wrote the review.
          IS_ANTHROPIC = model.startswith("claude-")
          if IS_ANTHROPIC:
              base_url = "https://api.anthropic.com"
              api_key = os.environ.get("ANTHROPIC_API_KEY", "").strip()
              if not api_key:
                  print(f"ERROR: Model '{model}' is an Anthropic model but ANTHROPIC_API_KEY is not set.",
                        file=sys.stderr)
                  sys.exit(1)
          else:
              base_url, api_key = resolve_endpoint(model)

          with open("branch_content.txt", "r", encoding="utf-8", errors="replace") as f:
              diff = f.read()

          num_ctx_tokens = int(os.environ.get("AI_ASSISTANT_MODEL_NUM_CTX", "32768"))
          num_predict_tokens = int(os.environ.get("AI_ASSISTANT_MODEL_NUM_PREDICT", "16384"))
          truncation_note = ""
          # The review instructions live in review_prompt.md so this workflow and
          # scripts/ai_code_review.py (used by the patcher) share one copy. They had
          # already forked: the script still carried the pre-enumeration prompt.
          with open("review_prompt.md", encoding="utf-8") as f:
              prompt_template = f.read()
          # Measure instruction overhead (template without the diff) to correctly
          # budget the remaining chars for source code. Code averages ~2.5 chars/token.
          # Reserve tokens for: instructions overhead + response (num_predict) + safety buffer.
          chars_per_token = 2.5
          instruction_chars = len(prompt_template.format(
              branch_name=branch_name, commit_sha=commit_sha, diff="", truncation_note=""))
          # num_ctx is not a local cap for either hosted provider: Anthropic never
          # receives it, and Ollama's cloud endpoint serves a model already
          # resident with its own context. Subtracting num_predict from it applies
          # local arithmetic to a remote window, which is how glm-5.3:cloud was
          # handed an empty "## Source Files" section at num_predict 128,000.
          # This mirrors scripts/ai_code_review.py; the two implementations of
          # this block must stay in step.
          _low = model.strip().lower()
          budget_ctx = num_ctx_tokens
          if _low.startswith("claude-") or _low.endswith(":cloud"):
              budget_ctx = max(num_ctx_tokens,
                               int(os.environ.get("AI_PATCH_HOSTED_CTX") or 200000))

          available_tokens = budget_ctx - num_predict_tokens - 500  # 500 token safety buffer
          max_diff_chars = max(0, int(available_tokens * chars_per_token) - instruction_chars)
          source_chars = len(diff)
          truncated = source_chars > max_diff_chars
          if truncated:
              pct = (max_diff_chars / source_chars * 100) if source_chars else 0.0
              diff = diff[:max_diff_chars]
              truncation_note = "[Note: the source listing below was truncated to fit the context window]"
              _msg = (f"the reviewer was shown {max_diff_chars:,} of {source_chars:,} chars "
                      f"({pct:.0f}%); it cannot be measured on code it never received")
              print(f"ERROR: source listing truncated \u2014 {_msg}. Raise num_ctx (or lower "
                    "num_predict) and re-run; this result is not comparable.", file=sys.stderr)
              if os.environ.get("GITHUB_ACTIONS", "").lower() == "true":
                  print(f"::error title=Reviewer input truncated::{_msg}")
              # Stop rather than spend the call. A reviewer handed no source either
              # invents a review or refuses to, and neither measures the model.
              if os.environ.get("AI_PATCH_ALLOW_TRUNCATION", "").strip() not in {"1", "true", "yes"}:
                  print("       Not sending the request. Set AI_PATCH_ALLOW_TRUNCATION=1 "
                        "to override.", file=sys.stderr)
                  sys.exit(1)

          print(f"Context: {budget_ctx} tokens"
                + (f" (num_ctx {num_ctx_tokens} raised for the hosted window)"
                   if budget_ctx != num_ctx_tokens else "")
                + f", instruction overhead: {instruction_chars} chars, "
                f"diff budget: {max_diff_chars} chars, actual diff: {len(diff)} chars, "
                f"truncated: {truncated}")

          prompt = prompt_template.format(
              branch_name=branch_name,
              commit_sha=commit_sha,
              diff=diff,
              truncation_note=truncation_note,
          )

          def _text_sha(text: str) -> str:
              """SHA-256 of the content with line endings normalised.

              Windows checkouts are CRLF and the Linux runner is LF, so hashing the
              raw bytes made the same file hash differently by platform.
              """
              return hashlib.sha256(
                  text.replace("\r\n", "\n").encode("utf-8")
              ).hexdigest()[:12]

          num_predict = num_predict_tokens
          temperature = float(os.environ.get("AI_ASSISTANT_MODEL_TEMPERATURE", "0.3"))
          options = {
              "temperature": temperature,
              "num_predict": num_predict,
              "num_ctx": num_ctx_tokens,
          }
          # Optional per-model sampler overrides. Left unset, whatever the model
          # Modelfile declares applies -- for Muse-Glimmer-30B that is top_p 0.95 and
          # top_k 64, which combined with the harness default temperature of 0.3 is
          # neither the model card config nor a clean deterministic one. Setting both
          # here makes the effective sampler independent of the server-side Modelfile.
          _top_p = os.environ.get("AI_ASSISTANT_MODEL_TOP_P", "").strip()
          _top_k = os.environ.get("AI_ASSISTANT_MODEL_TOP_K", "").strip()
          if _top_p:
              options["top_p"] = float(_top_p)
          if _top_k:
              options["top_k"] = int(_top_k)

          # System prompt. Sent on every request so the persona is identical across
          # on-prem Ollama, ':cloud' models and Anthropic -- a request system message
          # REPLACES the Modelfile SYSTEM block wholesale, so whatever each model was
          # built with is overridden here. 'none' opts out and restores the old
          # per-Modelfile behaviour.
          system_text = (os.environ.get("AI_ASSISTANT_MODEL_SYSTEM_PROMPT") or "").strip()
          if system_text.lower() == "none":
              system_text = ""

          # Reasoning effort is prepended to the same message rather than sent as a
          # second one -- previously this path hardcoded "You are a helpful assistant."
          # as the persona, which silently differed from every Modelfile.
          reasoning = os.environ.get("AI_ASSISTANT_MODEL_REASONING", "").strip()
          if reasoning:
              system_text = f"Reasoning strength: {reasoning}\n\n{system_text}".strip()

          messages = []
          if system_text:
              messages.append({"role": "system", "content": system_text})
          messages.append({"role": "user", "content": prompt})

          payload = {
              "model": model,
              "messages": messages,
              "stream": False,
              "options": options,
          }

          think = os.environ.get("AI_ASSISTANT_MODEL_THINK", "").strip()
          if think:
              _t = think.lower()
              payload["think"] = True if _t == "true" else False if _t == "false" else think

          # Anthropic uses a different request shape. Build it from scratch rather
          # than translating `options`: temperature, top_p and top_k are REMOVED on
          # Claude Opus 4.7 and later and return a 400, so a translated payload
          # fails on the first call. num_ctx has no equivalent -- the context window
          # is fixed -- but the source budget above still applies, so the prompt sent
          # is byte-identical to the one the Ollama models receive.
          effort = (os.environ.get("AI_ASSISTANT_MODEL_EFFORT") or "high").strip()
          if IS_ANTHROPIC:
              payload = {
                  "model": model,
                  "max_tokens": num_predict,
                  "messages": [{"role": "user", "content": prompt}],
                  # Adaptive thinking is the only supported mode on Opus 4.7+;
                  # 'summarized' opts back into readable reasoning, which the
                  # metrics report as the answer/reasoning split. Display costs
                  # nothing extra -- thinking is billed the same either way.
                  "thinking": {"type": "adaptive", "display": "summarized"},
                  "output_config": {"effort": effort},
              }
              if system_text:
                  # Anthropic takes the system prompt top-level, not as a message --
                  # same string as the Ollama path, so the persona is identical.
                  payload["system"] = system_text
              # Nothing was sent, so record nothing -- otherwise the scorecard would
              # claim a temperature that the API would have rejected.
              temperature = None
              options = {}

          if IS_ANTHROPIC:
              print(f"Sampler: Anthropic — effort={effort}, thinking=adaptive "
                    f"(temperature/top_p/top_k are not accepted by this model)")
          else:
              print(f"Sampler: temperature={temperature} "
                    f"top_p={options.get('top_p', '(model default)')} "
                    f"top_k={options.get('top_k', '(model default)')}")
          print(f"Reasoning: system={reasoning or '(model default)'} "
                f"think={payload.get('think', '(unset)')}")
          print(f"System prompt ({len(system_text)} chars): "
                f"{system_text or '(none sent -- model Modelfile applies)'}")

          with open("payload.json", "w") as f:
              json.dump(payload, f)

          print(f"Calling {base_url}/api/chat with model {model} …")

          if IS_ANTHROPIC:
              curl_cmd = [
                  "curl", "-s", "--show-error", "--fail-with-body", "--max-time", "7200",
                  "-X", "POST", f"{base_url}/v1/messages",
                  "-H", "content-type: application/json",
                  "-H", "anthropic-version: 2023-06-01",
                  "-H", f"x-api-key: {api_key}",
                  "-d", "@payload.json",
              ]
          else:
              curl_cmd = [
                  "curl", "-s", "--show-error", "--fail-with-body", "--max-time", "7200",
                  "-X", "POST", f"{base_url}/api/chat",
                  "-H", "Content-Type: application/json",
              ]
              if api_key:
                  curl_cmd += ["-H", f"Authorization: Bearer {api_key}"]
              curl_cmd += ["-d", "@payload.json"]

          # Anthropic returns no server-side timings, so wall clock is the only
          # duration available for that path.
          _t0 = time.monotonic()
          result = subprocess.run(curl_cmd, capture_output=True, text=True)
          _elapsed_s = round(time.monotonic() - _t0, 1)

          if result.returncode != 0:
              print(
                  f"ERROR: curl failed (exit {result.returncode})\n"
                  f"stderr: {result.stderr}\n"
                  f"body  : {result.stdout[:2000]}",
                  file=sys.stderr,
              )
              sys.exit(1)

          try:
              data = json.loads(result.stdout)
          except json.JSONDecodeError as exc:
              print(f"ERROR: Could not parse Ollama response: {exc}", file=sys.stderr)
              print(f"Raw output (first 500 chars): {result.stdout[:500]}", file=sys.stderr)
              sys.exit(1)

          import re as _re
          _think_re = _re.compile(r"<think>.*?</think>\s*", _re.DOTALL | _re.IGNORECASE)
          if IS_ANTHROPIC:
              # content is a LIST of blocks, not a string. Concatenate the text
              # blocks; thinking arrives as separate blocks rather than a field.
              _blocks = data.get("content") or []
              review = "".join(b.get("text", "") for b in _blocks if b.get("type") == "text").strip()
              thinking = "".join(b.get("thinking", "") for b in _blocks if b.get("type") == "thinking")
              _usage = data.get("usage") or {}
              _prompt_tokens = _usage.get("input_tokens", 0)
              _output_tokens = _usage.get("output_tokens", 0)
              _done_reason = data.get("stop_reason", "")

              # A refusal is HTTP 200 with empty content, so it has to be caught before
              # the empty-review check or it reads as a generic failure. Reviewing a
              # deliberately vulnerable banking app is security-adjacent and Opus-tier
              # models run cybersecurity classifiers -- defensive review should pass,
              # but the failure must be legible if it does not.
              if _done_reason == "refusal":
                  _sd = data.get("stop_details") or {}
                  print(
                      f"ERROR: {model} declined the request "
                      f"(category={_sd.get('category')!r}). {_sd.get('explanation') or ''}",
                      file=sys.stderr,
                  )
                  sys.exit(1)
          else:
              _msg = data.get("message") or {}
              # Ollama >= 0.9 returns reasoning in message.thinking rather than as inline
              # <think> tags. Those tokens still count toward eval_count / num_predict, so
              # a model can exhaust its output budget while returning empty content.
              thinking = _msg.get("thinking") or ""
              review = _think_re.sub("", _msg.get("content", "")).strip()
              _prompt_tokens = data.get("prompt_eval_count", 0)
              _output_tokens = data.get("eval_count", 0)
              _done_reason = data.get("done_reason", "")

          print(f"Response: content={len(review)} chars, thinking={len(thinking)} chars, "
                f"output_tokens={_output_tokens}, done_reason={_done_reason}")
          if not review:
              _hint = (
                  "stop_reason 'max_tokens' means the answer was cut off -- raise "
                  "AI_ASSISTANT_MODEL_NUM_PREDICT (it caps thinking AND answer together)."
                  if IS_ANTHROPIC else
                  "If thinking is large and done_reason is 'length', raise "
                  "AI_ASSISTANT_MODEL_NUM_PREDICT -- and raise AI_ASSISTANT_MODEL_NUM_CTX "
                  "with it, or the source budget shrinks silently."
              )
              print(
                  f"ERROR: {model} returned no content. thinking={len(thinking)} chars, "
                  f"output_tokens={_output_tokens}, done_reason={_done_reason}. {_hint}",
                  file=sys.stderr,
              )
              sys.exit(1)

          with open("review.md", "w", encoding="utf-8") as f:
              f.write(review)

          def _ns_to_s(ns):
              return round(ns / 1e9, 1) if ns else 0.0
          def _tps(tokens, duration_ns):
              return round(tokens / max(duration_ns / 1e9, 0.001), 1) if tokens and duration_ns else 0.0

          if IS_ANTHROPIC:
              # No server-side timings are returned, so wall clock is all there is.
              # prompt_tps stays 0.0 rather than dividing prompt tokens by total
              # elapsed, which would be a number with no meaning.
              #
              # context_window records num_ctx_tokens, NOT the model's 1M window.
              # The API does not accept num_ctx -- but num_ctx still governs the
              # source budget above ((num_ctx - num_predict - 500) * 2.5 chars), so
              # it is the number needed to reproduce the run. Reporting 1000000 here
              # made run #182 look like it used 3.2% of context while the source had
              # actually been truncated to fit a 32768 budget.
              _total_s, _load_s = _elapsed_s, 0.0
              _prompt_tps = 0.0
              _output_tps = round(_output_tokens / max(_elapsed_s, 0.001), 1) if _output_tokens else 0.0
              _ctx_window = num_ctx_tokens
          else:
              _total_s = _ns_to_s(data.get("total_duration"))
              _load_s = _ns_to_s(data.get("load_duration"))
              _prompt_tps = _tps(data.get("prompt_eval_count"), data.get("prompt_eval_duration"))
              _output_tps = _tps(data.get("eval_count"), data.get("eval_duration"))
              _ctx_window = num_ctx_tokens

          review_metrics = {
              "model": model,
              "temperature": temperature,
              "top_p": options.get("top_p"),
              "top_k": options.get("top_k"),
              "effort": effort if IS_ANTHROPIC else None,
              "reasoning": reasoning or None,
              "system_prompt": system_text or None,
              "think": payload.get("think"),
              "prompt_sha": _text_sha(prompt_template),
              "total_duration_s": _total_s,
              "load_duration_s": _load_s,
              "prompt_tokens": _prompt_tokens,
              "output_tokens": _output_tokens,
              "output_token_limit": num_predict_tokens,
              "content_chars": len(review),
              "thinking_chars": len(thinking),
              "prompt_tps": _prompt_tps,
              "output_tps": _output_tps,
              "context_window": _ctx_window,
              "context_utilization_pct": round(
                  (_prompt_tokens + _output_tokens) / max(_ctx_window, 1) * 100, 1
              ),
              "content_truncated": truncated,
              "done_reason": _done_reason,
          }
          with open("metrics.json", "w") as mf:
              json.dump({"review": review_metrics}, mf, indent=2)

          print(f"Review metrics: {review_metrics['total_duration_s']}s total | "
                f"prompt {review_metrics['prompt_tokens']:,} tok @ {review_metrics['prompt_tps']} tok/s | "
                f"output {review_metrics['output_tokens']:,} tok @ {review_metrics['output_tps']} tok/s | "
                f"context {review_metrics['context_utilization_pct']}% used | "
                f"done_reason={review_metrics['done_reason']}")
          print("Review saved to review.md")
          PYEOF

      # -----------------------------------------------------------------------
      # Score the review against every known issue in ISSUES.md.
      # A second Ollama call receives both the review and the issues reference
      # and produces a scorecard table (Found / Partial / Missed per issue ID).
      # -----------------------------------------------------------------------
      - name: Score review against ISSUES.md
        if: steps.diff.outputs.empty == 'false'
        env:
          # The scorer. Set by repo variable; Qwen3.8-27B-imatrix:Q4_K_S is the
          # benchmarked choice (scorer_benchmark.yml run #16 and later): 70/70 on a
          # review that names every defect, 0 false positives on one that names none,
          # and no evidence borrowed between neighbouring issues on the decoy.
          # It REQUIRES AI_ASSISTANT_SCORER_THINK=medium -- its card defaults to xhigh
          # reasoning and it will otherwise spend the whole budget thinking and return
          # empty content.
          SCORECARD_MODEL: ${{ vars.AI_ASSISTANT_OLLAMA_MODEL_REVIEWER }}
          # enforce = downgrade ungrounded Found/Partial rows to Missed (default)
          # warn    = log them but leave the scorecard untouched
          # off     = skip the check entirely (use when reproducing an archived run)
          AI_ASSISTANT_SCORECARD_GROUNDING: ${{ vars.AI_ASSISTANT_SCORECARD_GROUNDING || 'enforce' }}
          # The SCORER's own output budget -- deliberately separate from the review
          # model's, and named so scorer_benchmark.yml can read the identical value.
          # A repo variable set once therefore applies to both workflows.
          AI_ASSISTANT_SCORER_NUM_PREDICT: ${{ vars.AI_ASSISTANT_SCORER_NUM_PREDICT || '24000' }}
          # The scorer is the measuring instrument: keep it pinned at 0 and unchanged
          # even when the review sampler is retuned, or scores stop being comparable.
          # This default was 0.3 while every actual run used the repo variable at 0 --
          # scorer variance was the largest noise source in the model benchmark, where
          # one unchanged review scored 67 on one run and 22 on the next.
          AI_ASSISTANT_SCORER_TEMPERATURE: ${{ vars.AI_ASSISTANT_SCORER_TEMPERATURE || '0' }}
          # Reasoning control for the SCORER, mirroring the review model's knobs and
          # sharing names with scorer_benchmark.yml. Both blank by default. A scorer
          # whose card defaults to deep reasoning (Qwen3.8-27B defaults to xhigh) will
          # otherwise spend its whole num_predict thinking and return empty content.
          AI_ASSISTANT_SCORER_REASONING: ${{ vars.AI_ASSISTANT_SCORER_REASONING }}
          AI_ASSISTANT_SCORER_THINK: ${{ vars.AI_ASSISTANT_SCORER_THINK }}
          # The SCORER's system prompt, pinned here for the same reason as the
          # reviewer's: a request system message replaces the Modelfile SYSTEM, so
          # this is the value that actually applies no matter what the scorer model
          # was built with -- and unlike a Modelfile SYSTEM it is version-controlled
          # and printed in every scorecard.
          #
          # This matters because the scorer IS the measurement. Rebuilding it with a
          # different persona silently moves every score: on one fixed review, an
          # engineer persona scored 43 Found / 17 Partial and the standard persona
          # scored 46 / 14 -- identical input, identical temperature 0, ~3 points of
          # difference from the system prompt alone. Pinning it here means that can
          # no longer happen without showing up in the diff and in the artefact.
          #
          # Set to the literal string 'none' to send no system message and fall back
          # to the scorer model's own Modelfile.
          AI_ASSISTANT_SCORER_SYSTEM_PROMPT: >-
            ${{ vars.AI_ASSISTANT_SCORER_SYSTEM_PROMPT || 'You are an expert computer programmer with an eye for detail, who loves to provide high quality answers.' }}
          BRANCH_NAME: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          python3 - <<'PYEOF'
          import hashlib, json, os, re, subprocess, sys

          # `or` not a get() default: an unset repo variable arrives as "", which
          # a default would not replace, leaving the scorer model blank.
          model = (os.environ.get("SCORECARD_MODEL") or os.environ.get("OLLAMA_MODEL") or "").strip()

          def resolve_endpoint(m):
              """Pick the Ollama base URL + API key for a model tag.

              The tag is the only signal: a ':cloud' suffix routes to
              OLLAMA_CLOUD_URL with OLLAMA_API_KEY as a Bearer token; anything
              else goes to on-prem OLLAMA_URL with NO auth header, because local
              Ollama rejects Authorization with 400. Fails loudly rather than
              silently sending a local request to the cloud or vice versa.

              Mirrors resolve_endpoint() in scripts/ai_code_review.py -- keep the
              two in step.
              """
              cloud_url = os.environ.get("OLLAMA_CLOUD_URL", "https://ollama.com").strip().rstrip("/")
              onprem_url = os.environ.get("OLLAMA_URL", "").strip().rstrip("/")
              api_key = os.environ.get("OLLAMA_API_KEY", "").strip() or None
              if m.endswith(":cloud"):
                  if not cloud_url:
                      print(f"ERROR: Model '{m}' is a cloud model but OLLAMA_CLOUD_URL is empty.", file=sys.stderr)
                      sys.exit(1)
                  if not api_key:
                      print(f"ERROR: Model '{m}' requires OLLAMA_API_KEY to be set.", file=sys.stderr)
                      sys.exit(1)
                  return cloud_url, api_key
              if not onprem_url:
                  print(f"ERROR: Model '{m}' is a local model but OLLAMA_URL is not set.", file=sys.stderr)
                  sys.exit(1)
              return onprem_url, None

          base_url, api_key = resolve_endpoint(model)
          branch_name = os.environ.get("BRANCH_NAME", "(unknown branch)")
          commit_sha = os.environ.get("COMMIT_SHA", "(unknown commit)")

          with open("review.md", "r", encoding="utf-8", errors="replace") as f:
              review = f.read()

          with open("ISSUES.md", "r", encoding="utf-8", errors="replace") as f:
              issues = f.read()
          def _text_sha(text: str) -> str:
              """SHA-256 with line endings normalised -- see the review step."""
              return hashlib.sha256(
                  text.replace("\r\n", "\n").encode("utf-8")
              ).hexdigest()[:12]

          issues_sha = _text_sha(issues)

          # Scoring instructions live in scorer_prompt.md so this workflow and
          # scorer_benchmark.yml cannot drift apart -- they already had.
          with open("scorer_prompt.md", encoding="utf-8") as f:
              preamble = f.read()
          scorer_prompt_sha = _text_sha(preamble)

          num_ctx = int(os.environ.get("AI_ASSISTANT_MODEL_NUM_CTX", "32768"))
          num_predict = int(os.environ.get("AI_ASSISTANT_SCORER_NUM_PREDICT", "24000"))
          temperature = float(os.environ.get("AI_ASSISTANT_SCORER_TEMPERATURE", "0.3"))

          # Truncate the review if the full prompt would exceed the context window.
          # Code tokenizes at ~2-3 chars/token; multiply by 2 to stay safe.
          max_chars = num_ctx * 2
          full_prompt = preamble + issues + "\n\n---\n## AI Review Output\n\n" + review + "\n"
          if len(full_prompt) > max_chars:
              overhead = len(preamble) + len(issues) + 50
              review = review[: max(0, max_chars - overhead)]
          scoring_prompt = preamble + issues + "\n\n---\n## AI Review Output\n\n" + review + "\n"

          # System prompt for the scorer, sent on every request so the grading persona
          # is pinned by the workflow rather than by whatever the scorer model happens
          # to have been built with. 'none' opts out and restores the Modelfile.
          scorer_system = (os.environ.get("AI_ASSISTANT_SCORER_SYSTEM_PROMPT") or "").strip()
          if scorer_system.lower() == "none":
              scorer_system = ""

          # Reasoning is prepended to the same message rather than sent as a second
          # one -- this path used to hardcode "You are a helpful assistant." as the
          # persona, which differed from the scorer's own Modelfile without saying so.
          scorer_reasoning = os.environ.get("AI_ASSISTANT_SCORER_REASONING", "").strip()
          if scorer_reasoning:
              scorer_system = f"Reasoning strength: {scorer_reasoning}\n\n{scorer_system}".strip()

          scorer_messages = []
          if scorer_system:
              scorer_messages.append({"role": "system", "content": scorer_system})
          scorer_messages.append({"role": "user", "content": scoring_prompt})

          payload = {
              "model": model,
              "messages": scorer_messages,
              "stream": False,
              "options": {
                  "temperature": temperature,
                  "num_predict": num_predict,
                  "num_ctx": num_ctx,
              },
          }

          scorer_think = os.environ.get("AI_ASSISTANT_SCORER_THINK", "").strip()
          if scorer_think:
              _st = scorer_think.lower()
              payload["think"] = (True if _st == "true"
                                  else False if _st == "false" else scorer_think)

          print(f"Scorer reasoning: system={scorer_reasoning or '(model default)'} "
                f"think={payload.get('think', '(unset)')}")
          print(f"Scorer system prompt ({len(scorer_system)} chars): "
                f"{scorer_system or '(none sent -- scorer Modelfile applies)'}")

          _think_re = re.compile(r"<think>.*?</think>\s*", re.DOTALL | re.IGNORECASE)

          def call_scorer(attempt):
              """One scoring round-trip. Returns (response_json, scorecard_markdown)."""
              with open("scoring_payload.json", "w") as f:
                  json.dump(payload, f)

              review_model = os.environ.get("OLLAMA_MODEL")
              suffix = "" if attempt == 1 else f" [attempt {attempt}]"
              print(f"Scoring with {model} (review was by {review_model}){suffix} …")

              curl_cmd = [
                  "curl", "-s", "--show-error", "--fail-with-body", "--max-time", "7200",
                  "-X", "POST", f"{base_url}/api/chat",
                  "-H", "Content-Type: application/json",
              ]
              if api_key:
                  curl_cmd += ["-H", f"Authorization: Bearer {api_key}"]
              curl_cmd += ["-d", "@scoring_payload.json"]

              result = subprocess.run(curl_cmd, capture_output=True, text=True)

              if result.returncode != 0:
                  print(
                      f"ERROR: curl failed (exit {result.returncode})\n"
                      f"stderr: {result.stderr}\n"
                      f"body  : {result.stdout[:2000]}",
                      file=sys.stderr,
                  )
                  sys.exit(1)

              try:
                  response = json.loads(result.stdout)
              except json.JSONDecodeError as exc:
                  print(f"ERROR: Could not parse Ollama response: {exc}", file=sys.stderr)
                  print(f"Raw output (first 500 chars): {result.stdout[:500]}", file=sys.stderr)
                  sys.exit(1)

              text = _think_re.sub("", (response.get("message") or {}).get("content", "")).strip()
              if not text:
                  print("ERROR: Ollama returned an empty scorecard response.", file=sys.stderr)
                  sys.exit(1)

              # Workflow prepends its own H1 + branch/commit line; drop the model's copy.
              text = re.sub(
                  r"^#\s*AI\s+Review\s+Scorecard\s*\n+",
                  "",
                  text,
                  count=1,
                  flags=re.IGNORECASE,
              ).lstrip()
              return response, text

          # Scorecard post-processing lives in scorecard_tools.py so this workflow
          # and scorer_benchmark.yml share one implementation.
          sys.path.insert(0, ".")
          from scorecard_tools import (
              WATCHLIST,
              count_table_statuses,
              drop_duplicate_ids,
              check_line_citations,
              check_row_alignment,
              downgrade_self_declared_absent,
              drop_unknown_ids,
              enforce_note_grounding,
              hedge_check,
              reconcile_summary_line,
              spot_check,
              warn_repeated_notes,
          )

          grounding_mode = os.environ.get("AI_ASSISTANT_SCORECARD_GROUNDING", "enforce").strip().lower()
          if grounding_mode not in ("enforce", "warn", "off"):
              print(f"WARN: unknown grounding mode {grounding_mode!r}; using 'enforce'.",
                    file=sys.stderr)
              grounding_mode = "enforce"

          # A zero-Partial scorecard CORRELATES with the scorer's credit-everything mode,
          # but it is not proof of it: as the review improves, a genuinely clean sheet
          # becomes plausible, and re-rolling one would be selecting for the answer we
          # expect. So this is a warning, not a gate -- the decisive evidence comes from
          # the spot-check below, which tests whether a row's target appears in the review
          # at all. Set AI_ASSISTANT_SCORER_MAX_ATTEMPTS > 1 to opt back into re-scoring.
          MAX_ATTEMPTS = max(1, int(os.environ.get("AI_ASSISTANT_SCORER_MAX_ATTEMPTS", "1")))

          attempts = []
          for attempt in range(1, MAX_ATTEMPTS + 1):
              data, scorecard = call_scorer(attempt)
              body = drop_duplicate_ids(scorecard)
              body, unknown_ids = drop_unknown_ids(body, issues)
              body, grounding_downgrades = enforce_note_grounding(body, review, grounding_mode)
              body, self_declared = downgrade_self_declared_absent(body)
              misaligned, missing_ids = check_row_alignment(body, issues)
              # Recount only after dedupe and downgrades, so the summary matches the tables.
              body = reconcile_summary_line(body)
              rf, rp, rm = count_table_statuses(body)
              attempts.append(
                  {"body": body, "data": data, "downgrades": grounding_downgrades,
                   "unknown_ids": unknown_ids, "self_declared": self_declared,
                   "misaligned": misaligned, "missing_ids": missing_ids,
                   "found": rf, "partial": rp, "missed": rm, "n": attempt}
              )
              if rp > 0 or (rf + rp + rm) < 40:
                  break
              print(
                  f"WARN: scoring attempt {attempt} returned {rf} Found and ZERO Partial "
                  f"across {rf + rp + rm} rows -- the scorer's credit-everything mode. "
                  + ("Re-scoring." if attempt < MAX_ATTEMPTS else "No attempts left."),
                  file=sys.stderr,
              )

          chosen = next((a for a in attempts if a["partial"] > 0), attempts[0])
          body = chosen["body"]
          data = chosen["data"]
          grounding_downgrades = chosen["downgrades"]
          rf, rp, rm = chosen["found"], chosen["partial"], chosen["missed"]
          row_total = rf + rp + rm
          scorer_mode_suspect = rp == 0 and row_total >= 40
          if len(attempts) > 1:
              print("Scoring attempts: "
                    + "; ".join(f"#{a['n']} {a['found']}F/{a['partial']}P/{a['missed']}M"
                                for a in attempts)
                    + f" -> using #{chosen['n']}")
          if scorer_mode_suspect:
              print(
                  f"NOTE: scorecard has {rf} Found and zero Partial. That is either a very "
                  "good review or the scorer's credit-everything mode -- see the spot-check "
                  "below, which distinguishes them.",
                  file=sys.stderr,
              )

          spot_rows, miscredits, undercredits, unsupported = spot_check(body, review)
          hedged = hedge_check(body)
          adjusted_found = rf - len(miscredits)
          # Lower bound: every self-hedged row treated as an over-credit too.
          found_floor = adjusted_found - len([h for h in hedged if h[0] not in miscredits])

          if hedged:
              print(
                  "WARN: %d row(s) rated Found whose Note concedes the review fell short "
                  "(%s). Each is likely an over-credit; plausible floor %d of %d."
                  % (len(hedged), ", ".join(h[0] for h in hedged), found_floor, row_total),
                  file=sys.stderr,
              )

          print("Evidence spot-check: %d/%d watchlist rows present in review; "
                "%d mis-credited (%s); %d unsupported Partial (%s); "
                "%d possibly under-credited (%s)"
                % (sum(1 for r in spot_rows if r[3] == "yes"), len(spot_rows),
                   len(miscredits), ", ".join(miscredits) or "none",
                   len(unsupported), ", ".join(unsupported) or "none",
                   len(undercredits), ", ".join(undercredits) or "none"))
          if miscredits:
              print(
                  f"WARN: {len(miscredits)} row(s) rated Found whose target string never "
                  f"appears in review.md: {', '.join(miscredits)}. Reported score {rf} "
                  f"overstates by at least that much; adjusted = {adjusted_found}.",
                  file=sys.stderr,
              )

          cite_total, cite_bad, cite_files = check_line_citations(review)
          # Precision: of the Found rows the watchlist can actually check, how many
          # survive. Adjusted Found subtracts the mis-credits found; this reports the
          # RATE, which is what generalises to the rows that cannot be checked.
          found_checked = len([r for r in spot_rows if r[1] == "Found"])
          precision = (1.0 - len(miscredits) / found_checked) if found_checked else None
          warn_repeated_notes(body)
          if row_total != 70:
              print(
                  f"WARN: Scorecard has {row_total} table data rows; expected exactly 70 "
                  f"(69 IDs C1-CF9 plus one UT row for Missing Unit Tests).",
                  file=sys.stderr,
              )

          header = (
              f"# AI Review Scorecard\n\n"
              f"> **Branch:** `{branch_name}` &nbsp;·&nbsp; **Commit:** `{commit_sha[:7]}`\n\n"
          )
          if misaligned or missing_ids:
              _bad = ", ".join(r for r, _ in misaligned) + (
                  ("; absent: " + ", ".join(missing_ids)) if missing_ids else "")
              header += (
                  f"> ⚠ **{len(misaligned) + len(missing_ids)} row(s) do not line up "
                  f"with ISSUES.md** ({_bad}). The scorer dropped or renumbered rows, so "
                  f"these IDs were scored against a different issue -- their ratings, Notes "
                  f"and spot-check verdicts are void and the totals below are unreliable."
                  "\n\n"
              )
          if miscredits:
              header += (
                  f"> ⚠ **{len(miscredits)} row(s) rated Found name a target that never appears "
                  f"in the review** ({', '.join(miscredits)}). Adjusted Found: "
                  f"**{adjusted_found}** of {row_total}. See the spot-check below.\n\n"
              )
          elif hedged:
              header += (
                  f"> ⚠ **{len(hedged)} row(s) rated Found concede in their own Note that the "
                  f"review fell short** ({', '.join(h[0] for h in hedged)}). Plausible floor: "
                  f"**{found_floor}** of {row_total}. See the spot-check below.\n\n"
              )
          elif scorer_mode_suspect:
              header += (
                  f"> **{rf} Found, zero Partial.** The spot-check below found no mis-credited "
                  "watchlist rows, but a zero-Partial sheet is worth a second look.\n\n"
              )

          # Everything needed to reproduce this run, recorded from what was actually sent
          # rather than from the config file, which may have moved on since.
          try:
              with open("metrics.json") as _mf:
                  _rev = json.load(_mf).get("review", {})
          except (FileNotFoundError, json.JSONDecodeError):
              _rev = {}

          def _val(v, blank="(model default)"):
              if v is None or v == "":
                  return blank
              return f"`{v}`"

          config_rows = [
              ("Review model", _val(_rev.get("model"), "(unknown)")),
              ("Reasoning strength (system prompt)", _val(_rev.get("reasoning"))),
              ("System prompt", _val(_rev.get("system_prompt"), "(none sent)")),
              ("Ollama `think`", _val(_rev.get("think"), "(unset)")),
              ("Temperature", _val(_rev.get("temperature"), "(unknown)")),
              ("top_p", _val(_rev.get("top_p"))),
              ("top_k", _val(_rev.get("top_k"))),
              ("Effort (Anthropic only)", _val(_rev.get("effort"), "(n/a)")),
              ("num_ctx", _val(_rev.get("context_window"), "(unknown)")),
              ("num_predict", _val(_rev.get("output_token_limit"), "(unknown)")),
              ("Source truncated", _val("yes" if _rev.get("content_truncated") else "no")),
              ("Review prompt SHA-256", _val(_rev.get("prompt_sha"), "(unknown)")),
              ("Scorer model", _val(model, "(unknown)")),
              ("Scorer temperature", _val(temperature, "(unknown)")),
              ("Scorer reasoning", _val(scorer_reasoning)),
              ("Scorer system prompt", _val(scorer_system, "(none sent)")),
              ("Scorer `think`", _val(payload.get("think"), "(unset)")),
              ("Scorer attempts", _val(len(attempts))),
              ("Grounding mode", _val(grounding_mode)),
              ("Grounding downgrades", _val(len(grounding_downgrades))),
              ("Self-declared-absent downgrades", _val(len(self_declared))),
              ("Rows misaligned with ISSUES.md", _val(len(misaligned) + len(missing_ids))),
              ("Review citations past end of file",
               _val(f"{cite_bad} of {cite_total}" if cite_total else "(none parsed)")),
              ("Precision (checkable Found rows)",
               _val(f"{precision:.0%} ({found_checked - len(miscredits)} of {found_checked})"
                    if precision is not None else "(no checkable rows)")),
              ("Scorer prompt SHA-256", _val(scorer_prompt_sha, "(unknown)")),
              ("ISSUES.md SHA-256", _val(issues_sha, "(unknown)")),
              ("Branch / commit", _val(f"{branch_name} @ {commit_sha[:7]}")),
          ]
          spot_section = (
              "\n---\n\n## Evidence Spot-Check\n\n"
              "Fixed list of rows whose target is an unambiguous string. If the string appears "
              "nowhere in the review, the review cannot have found that issue, so a `Found` "
              "rating is a mis-credit. The converse does not hold: a present target is not "
              "proof the rating is right.\n\n"
              "| ID | Status | Target string | In review | Verdict |\n|---|---|---|---|---|\n"
              + "".join(f"| {r[0]} | {r[1]} | `{r[2]}` | {r[3]} | {r[4]} |\n" for r in spot_rows)
              + (f"\n**Adjusted Found: {adjusted_found} of {row_total}** "
                 f"({rf} reported, less {len(miscredits)} mis-credited).\n"
                 if miscredits else "\nNo mis-credits detected in the watchlist.\n")
              # The under-credit direction. Never deducted and never added: a
              # present target is not proof the review covered the issue, the
              # same asymmetry that stops a present target from confirming a
              # Found. Reported so a false Missed is at least visible -- it
              # costs the model a point and nothing else in the harness looks
              # for it.
              # Reported directly above the under-credit line so the two
              # directions read together.
              + (f"\n> **{len(unsupported)} row(s) rated `Partial` whose target string "
                 f"appears NOWHERE in the review** ({', '.join(unsupported)}). A Partial "
                 f"on an unmentioned issue is a Missed; the reported Missed count is "
                 f"correspondingly understated.\n"
                 if unsupported else "")
              + (f"\n> **{len(undercredits)} row(s) rated `Partial`/`Missed` whose target "
                 f"string IS present in the review** ({', '.join(undercredits)}). "
                 f"The score is left as the scorer rated it; read these rows before "
                 f"trusting the Missed count.\n"
                 if undercredits else "")
          )

          if hedged:
              spot_section += (
                  "\n### Self-hedged ratings\n\n"
                  "Rows rated `Found` whose own Note concedes the review did not cover the "
                  "target. That phrasing describes a Partial; each is likely an over-credit, "
                  "though a conceded detail can be incidental to the reference issue.\n\n"
                  "| ID | Hedge | Note |\n|---|---|---|\n"
                  + "".join(
                      f"| {rid} | `{phrase}` | {note[:180].replace('|', '\\|')} |\n"
                      for rid, phrase, note in hedged
                  )
                  + f"\n**Plausible floor: {found_floor} of {row_total}** "
                    f"(adjusted {adjusted_found}, less {len([h for h in hedged if h[0] not in miscredits])} "
                    "self-hedged).\n"
              )

          appendix = (
              "\n---\n\n## Run Configuration\n\n"
              "Values as actually sent to Ollama for this run. Blank sampler entries mean the "
              "request omitted them, so the model's own Modelfile applied.\n\n"
              "| Setting | Value |\n|---|---|\n"
              + "".join(f"| {k} | {v} |\n" for k, v in config_rows)
          )

          with open("issues_scorecard.md", "w", encoding="utf-8") as f:
              f.write(header + body + spot_section + appendix)

          def _ns_to_s(ns):
              return round(ns / 1e9, 1) if ns else 0.0
          def _tps(tokens, duration_ns):
              return round(tokens / max(duration_ns / 1e9, 0.001), 1) if tokens and duration_ns else 0.0

          scoring_metrics = {
              "model": model,
              "system_prompt": scorer_system or None,
              "reasoning": scorer_reasoning or None,
              "temperature": temperature,
              "total_duration_s": _ns_to_s(data.get("total_duration")),
              "load_duration_s": _ns_to_s(data.get("load_duration")),
              "prompt_tokens": data.get("prompt_eval_count", 0),
              "output_tokens": data.get("eval_count", 0),
              "prompt_tps": _tps(data.get("prompt_eval_count"), data.get("prompt_eval_duration")),
              "output_tps": _tps(data.get("eval_count"), data.get("eval_duration")),
              "done_reason": data.get("done_reason", ""),
          }
          score_result = {
              "found": rf, "partial": rp, "missed": rm,
              "total": row_total,
              "score_pct": round(rf / max(row_total, 1) * 100, 1),
              "grounding_mode": grounding_mode,
              "scoring_attempts": len(attempts),
              "scorer_mode_suspect": scorer_mode_suspect,
              "spotcheck_miscredits": miscredits,
              "spotcheck_undercredits": undercredits,
              "spotcheck_unsupported_partials": unsupported,
              "spotcheck_found_checked": found_checked,
              "precision": round(precision, 4) if precision is not None else None,
              "citations_total": cite_total,
              "citations_beyond_eof": cite_bad,
              "found_adjusted": adjusted_found,
              "found_floor": found_floor,
              "hedged_rows": [h[0] for h in hedged],
              "score_pct_adjusted": round(adjusted_found / max(row_total, 1) * 100, 1),
              "grounding_downgrades": len(grounding_downgrades),
              "grounding_downgraded_ids": [r for r, _s, _b in grounding_downgrades],
          }
          try:
              with open("metrics.json") as mf:
                  all_metrics = json.load(mf)
          except (FileNotFoundError, json.JSONDecodeError):
              all_metrics = {}
          all_metrics["scoring"] = scoring_metrics
          all_metrics["score"] = score_result
          all_metrics["combined_total_s"] = round(
              all_metrics.get("review", {}).get("total_duration_s", 0.0) +
              scoring_metrics["total_duration_s"], 1
          )
          with open("metrics.json", "w") as mf:
              json.dump(all_metrics, mf, indent=2)

          print(f"Scoring metrics: {scoring_metrics['total_duration_s']}s total | "
                f"output {scoring_metrics['output_tokens']:,} tok @ {scoring_metrics['output_tps']} tok/s | "
                f"done_reason={scoring_metrics['done_reason']}")
          print(f"Combined review + scoring: {all_metrics['combined_total_s']}s")
          print("Scorecard saved to issues_scorecard.md")
          PYEOF

      # -----------------------------------------------------------------------
      # Generate a human-readable metrics.md from metrics.json
      # -----------------------------------------------------------------------
      - name: Generate metrics report
        if: steps.diff.outputs.empty == 'false'
        env:
          BRANCH_NAME: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          python3 - <<'PYEOF'
          import json, os

          branch_name = os.environ.get("BRANCH_NAME", "")
          commit_sha  = os.environ.get("COMMIT_SHA", "")
          run_number  = os.environ.get("RUN_NUMBER", "")

          try:
              with open("metrics.json") as f:
                  m = json.load(f)
          except (FileNotFoundError, json.JSONDecodeError) as exc:
              print(f"No metrics.json found ({exc}); skipping metrics report.")
              raise SystemExit(0)

          r  = m.get("review", {})
          s  = m.get("scoring", {})
          sc = m.get("score", {})
          combined = m.get("combined_total_s", 0)

          def fmt_s(secs):
              if secs >= 60:
                  return f"{int(secs // 60)}m {secs % 60:.0f}s"
              return f"{secs:.1f}s"

          out_tokens   = r.get("output_tokens", 0)
          out_limit    = r.get("output_token_limit", 0)
          done_review  = r.get("done_reason", "")
          done_scoring = s.get("done_reason", "")
          truncated    = r.get("content_truncated", False)

          def _samp(key, label):
              v = r.get(key)
              return f"{label} {v}" if v is not None else f"{label} (model default)"

          sampler = ", ".join([
              f"temp {r.get('temperature', '?')}",
              _samp("top_p", "top_p"),
              _samp("top_k", "top_k"),
          ])

          lines = [
              "# AI Model Performance Metrics\n",
              f"> **Branch:** `{branch_name}` &nbsp;·&nbsp; "
              f"**Commit:** `{commit_sha[:7]}` &nbsp;·&nbsp; **Run:** #{run_number}\n",
              "",
              "## Score",
              f"Total: {sc.get('found','?')} Found / {sc.get('partial','?')} Partial / "
              f"{sc.get('missed','?')} Missed out of {sc.get('total','?')} issues "
              f"({sc.get('score_pct','?')}% Found)",
              "",
              (f"> **⚠ Spot-check: {len(sc.get('spotcheck_miscredits', []))} row(s) rated Found "
               f"({', '.join(sc.get('spotcheck_miscredits', []))}) name a target absent from the "
               f"review. Adjusted: {sc.get('found_adjusted','?')} Found "
               f"({sc.get('score_pct_adjusted','?')}%).**\n"
               if sc.get("spotcheck_miscredits") else
               f"> **⚠ {len(sc.get('hedged_rows', []))} row(s) rated Found concede in their own "
               f"Note that the review fell short ({', '.join(sc.get('hedged_rows', []))}). "
               f"Plausible floor: {sc.get('found_floor','?')} Found.**\n"
               if sc.get("hedged_rows") else
               "> Zero Partial ratings — spot-check found no mis-credits, but worth a second look.\n"
               if sc.get("scorer_mode_suspect") else ""),
              f"Scorer grounding: {sc.get('grounding_mode','?')} mode, "
              f"{sc.get('grounding_downgrades', 0)} row(s) downgraded for unsupported evidence"
              + (f" ({', '.join(sc.get('grounding_downgraded_ids', []))})"
                 if sc.get('grounding_downgraded_ids') else ""),
              "",
              "## Review Performance",
              f"**Model:** `{r.get('model','?')}`\n",
              "| Metric | Value |",
              "|--------|-------|",
              f"| Total time | {fmt_s(r.get('total_duration_s', 0))} |",
              f"| Model load time | {fmt_s(r.get('load_duration_s', 0))} |",
              f"| Inference time | {fmt_s(r.get('total_duration_s', 0) - r.get('load_duration_s', 0))} |",
              f"| Sampler | {sampler} |",
              f"| Reasoning | {_samp('reasoning', 'system')}, {_samp('think', 'think')} |",
              f"| Prompt tokens | {r.get('prompt_tokens', 0):,} |",
              f"| Output tokens | {out_tokens:,} of {out_limit:,} limit |",
              f"| Answer / reasoning split | {r.get('content_chars', 0):,} chars answer, "
              f"{r.get('thinking_chars', 0):,} chars reasoning |",
              f"| Output speed | {r.get('output_tps', 0)} tok/s |",
              f"| Prompt speed | {r.get('prompt_tps', 0)} tok/s |",
              f"| Context window | {r.get('context_window', 0):,} tokens |",
              f"| Context utilization | {r.get('context_utilization_pct', 0)}% |",
              f"| Content truncated | {'**Yes ⚠**' if truncated else 'No'} |",
              f"| Completed naturally | {'No ⚠ (hit token limit)' if done_review == 'length' else 'Yes'} |",
              "",
              "## Scoring Performance",
              f"**Model:** `{s.get('model','?')}`\n",
              "| Metric | Value |",
              "|--------|-------|",
              f"| Total time | {fmt_s(s.get('total_duration_s', 0))} |",
              f"| Model load time | {fmt_s(s.get('load_duration_s', 0))} |",
              f"| Prompt tokens | {s.get('prompt_tokens', 0):,} |",
              f"| Output tokens | {s.get('output_tokens', 0):,} |",
              f"| Output speed | {s.get('output_tps', 0)} tok/s |",
              f"| Prompt speed | {s.get('prompt_tps', 0)} tok/s |",
              f"| Completed naturally | {'No ⚠ (hit token limit)' if done_scoring == 'length' else 'Yes'} |",
              "",
              "## Combined",
              "| Metric | Value |",
              "|--------|-------|",
              f"| Review + scoring time | {fmt_s(combined)} |",
          ]

          with open("metrics.md", "w", encoding="utf-8") as f:
              f.write("\n".join(lines) + "\n")

          print("Metrics report saved to metrics.md")
          PYEOF

      # -----------------------------------------------------------------------
      # Print the scorecard to the workflow log so it is visible without
      # navigating away from the Actions run page.
      # -----------------------------------------------------------------------
      - name: Print scorecard to workflow log
        if: steps.diff.outputs.empty == 'false'
        run: |
          echo "======================================================================"
          echo "  PERFORMANCE METRICS"
          echo "======================================================================"
          cat metrics.md
          echo ""
          echo "======================================================================"
          echo "  ISSUES.md SCORECARD"
          echo "======================================================================"
          cat issues_scorecard.md
          echo ""
          echo "======================================================================"
          echo "  AI REVIEW"
          echo "======================================================================"
          cat review.md

      # -----------------------------------------------------------------------
      # Upload review, scorecard, and metrics as one downloadable artifact
      # -----------------------------------------------------------------------
      - name: Upload AI review artifact
        if: steps.diff.outputs.empty == 'false'
        uses: actions/upload-artifact@v7
        with:
          # Model, not branch: a branch is a label, the model is what was measured.
          name: ai-review-${{ steps.cfg.outputs.safe_model }}-${{ github.run_number }}
          path: |
            review.md
            issues_scorecard.md
            metrics.md
            metrics.json
          retention-days: 90
