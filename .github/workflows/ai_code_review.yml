name: AI Code Review

on:
  workflow_dispatch

permissions:
  contents: read

env:
  OLLAMA_URL: ${{ vars.AI_ASSISTANT_OLLAMA_URL }}
  OLLAMA_MODEL: Muse-Glimmer-30B-imatrix:Q4_K_S
  AI_ASSISTANT_MODEL_NUM_CTX: 49152
  AI_ASSISTANT_MODEL_NUM_PREDICT: 24000
  # Sampler. These job-level values are authoritative -- do NOT redeclare them in a
  # step's own env block, because step-level env silently overrides job-level.
  #
  # Temperature stays at the benchmark default of 0.3. The Muse-Glimmer-30B model card
  # recommends 1.0, and run #134 tested exactly that against run #133 at 0.3 (same
  # prompt, same scorer): 51 Found vs 54, losing the RecordTransaction and DeleteUser
  # injections, the accountNumber null check, and the duplicated-validation refactor.
  # High temperature suits open-ended generation; this task is exhaustive enumeration
  # against a checklist, and sharpening the distribution helps it.
  #
  # top_p/top_k are the card's values, set explicitly so the effective sampler does not
  # depend on which Modelfile happens to be loaded on the Ollama server.
  AI_ASSISTANT_MODEL_TEMPERATURE: 0.3
  AI_ASSISTANT_MODEL_TOP_P: 0.95
  AI_ASSISTANT_MODEL_TOP_K: 64

jobs:
  code-review:
    # REQUIRED: must use a self-hosted runner that can reach 192.168.10.100
    # Add additional labels (e.g. [self-hosted, linux]) to target a specific runner
    runs-on: mra-ubuntu
    timeout-minutes: 180

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      # -----------------------------------------------------------------------
      # Collect every tracked source file on the branch into a single document
      # so the model reviews the full codebase, not just what changed.
      # -----------------------------------------------------------------------
      - name: Collect branch source files
        id: diff
        run: |
          git ls-files -- 'SampleBankingApp/' \
            | grep -E '\.(cs|json|csproj|yml|yaml|config|xml|html|css|js|ts|md)$' \
            | grep -v -E '(\.min\.js|\.min\.css|package-lock\.json|yarn\.lock|\.lock|\.sum)$' \
            > file_list.txt

          : > branch_content.txt
          while IFS= read -r file; do
            echo "### File: $file" >> branch_content.txt
            echo '```' >> branch_content.txt
            nl -ba "$file" >> branch_content.txt
            echo '```' >> branch_content.txt
            echo "" >> branch_content.txt
          done < file_list.txt

          CONTENT_SIZE=$(wc -c < branch_content.txt)
          echo "diff_size=${CONTENT_SIZE}" >> "$GITHUB_OUTPUT"

          if [ "$CONTENT_SIZE" -eq 0 ]; then
            echo "empty=true" >> "$GITHUB_OUTPUT"
          else
            echo "empty=false" >> "$GITHUB_OUTPUT"
            echo "Collected $(wc -l < file_list.txt) files (${CONTENT_SIZE} bytes)"
          fi

      - name: Debug prompt size
        if: steps.diff.outputs.empty == 'false'
        run: |
          CHARS=$(wc -c < branch_content.txt)
          WORDS=$(wc -w < branch_content.txt)
          # Mirror the review step budget: (num_ctx - num_predict - 500 safety) * 2.5
          # chars/token, before the ~7.5k chars of instruction overhead it also subtracts.
          BUDGET=$(( (AI_ASSISTANT_MODEL_NUM_CTX - AI_ASSISTANT_MODEL_NUM_PREDICT - 500) * 5 / 2 ))
          echo "Content: ${CHARS} chars, ${WORDS} words"
          echo "num_ctx=${AI_ASSISTANT_MODEL_NUM_CTX} num_predict=${AI_ASSISTANT_MODEL_NUM_PREDICT}"
          echo "Source char budget, before instruction overhead: ${BUDGET}"
          echo "Conservative token estimate (chars / 2.5): $(( CHARS * 2 / 5 ))"
          echo "Payload will be truncated: $([ $CHARS -gt $BUDGET ] && echo YES || echo NO)"

            
      - name: Skip if no relevant changes
        if: steps.diff.outputs.empty == 'true'
        run: echo "No reviewable changes on this branch — skipping AI review."

      # -----------------------------------------------------------------------
      # Send the diff to Ollama and save the review to review.txt
      # -----------------------------------------------------------------------
      - name: Request review from Ollama
        if: steps.diff.outputs.empty == 'false'
        env:
          AI_ASSISTANT_MODEL_PROMPT: ${{ vars.AI_ASSISTANT_MODEL_PROMPT }}
          BRANCH_NAME: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          python3 - <<'PYEOF'
          import json, os, subprocess, sys

          branch_name = os.environ.get("BRANCH_NAME", "(unknown branch)")
          commit_sha = os.environ.get("COMMIT_SHA", "(unknown commit)")
          model = os.environ.get("OLLAMA_MODEL")
          base_url = os.environ.get("OLLAMA_URL")

          with open("branch_content.txt", "r", errors="replace") as f:
              diff = f.read()

          num_ctx_tokens = int(os.environ.get("AI_ASSISTANT_MODEL_NUM_CTX", "32768"))
          num_predict_tokens = int(os.environ.get("AI_ASSISTANT_MODEL_NUM_PREDICT", "16384"))
          truncation_note = ""
          prompt_template = (
              "You are an expert software engineer performing a thorough peer code review.\n"
              "Review the source files from branch '{branch_name}' (commit {commit_sha}).\n\n"
              "{truncation_note}\n\n"
              "Work through EVERY category below methodically. For each category, read every file "
              "carefully and report ALL issues you find, no matter how minor. Do not skip a category "
              "because you found nothing — if a category is clean, say so.\n\n"
              "---\n\n"
              "## Review Categories\n\n"
              "### 1. Security Vulnerabilities\n"
              "Check for: SQL injection (including string-interpolated queries, LIKE clauses, UPDATE/DELETE/INSERT statements, "
              "and helper methods that accept raw SQL fragments); hardcoded credentials, passwords, API keys, or backdoors "
              "in source files or config; broken or weak cryptography (MD5, SHA1, no salt); JWT misconfiguration "
              "(ValidateLifetime, weak secrets); broken access control (missing ownership checks on PUT/DELETE endpoints); "
              "missing authorization attributes; open CORS policy; developer exception pages in production; HTTPS disabled; "
              "debug symbols in release builds; production secrets committed to source control.\n\n"
              "### 2. Logic Errors\n"
              "Check for: off-by-one errors (especially in pagination — e.g. `page * pageSize` vs `(page-1) * pageSize`); "
              "incorrect boundary conditions (e.g. `< 0` when `<= 0` is needed); balance or fee calculations that exclude "
              "a component (e.g. checking balance >= amount but then deducting amount + fee); incorrect rates or constants "
              "(e.g. interest rate applied as 5%% instead of 1%%); missing self-referential checks (e.g. transferring to yourself); "
              "any operation that can produce a negative balance or nonsensical result.\n\n"
              "### 3. Error Handling\n"
              "Check for: methods that catch broad `Exception` and swallow it silently; catch blocks that return empty "
              "collections — callers cannot distinguish 'no results' from 'error'; operations that lack a database "
              "transaction where two or more writes must be atomic; side effects (e.g. email sending) that can throw "
              "after a DB write has already committed; raw `ex.Message` or stack traces returned to HTTP clients; "
              "missing rate limiting or account lockout on authentication endpoints.\n\n"
              "### 4. Resource Leaks\n"
              "Check for: `SqlConnection`, `SqlDataReader`, `SqlCommand` that are opened but never closed or disposed; "
              "connections returned from helper methods where the caller never disposes them; `SmtpClient` held as an "
              "instance field (not thread-safe, socket never released); `MailMessage` or other `IDisposable` objects "
              "created but never disposed; any exception path that skips a `Close()` or `Dispose()` call.\n\n"
              "### 5. Null Reference Risks\n"
              "Check for: configuration values read with `_config[\"key\"]` passed directly to methods that cannot "
              "accept null (e.g. `Encoding.UTF8.GetBytes`); `DataTable.Rows[0]` accessed without first checking "
              "`Rows.Count > 0`; `.Value` on a nullable or `?.Value` result passed to `int.Parse` without null guard; "
              "method parameters used (`.ToUpper()`, `.Length`, etc.) before a null check; model-bound request objects "
              "used in controller actions without a null check.\n\n"
              "### 6. Dead Code\n"
              "Work this category as a search, not an impression -- an unused method is proved by the "
              "ABSENCE of a caller, which you cannot see by reading top to bottom.\n"
              "Step 1: list EVERY method defined in the source files above. Include private methods, "
              "public methods, and helpers in every class -- services, controllers, data access and "
              "utility classes alike.\n"
              "Step 2: for each name on that list, scan all the source files for a call to it.\n"
              "Step 3: report every method whose name appears only at its own definition. Name each "
              "one explicitly in its own row. Work the whole list -- do not stop once you have found "
              "a few, and do not assume a method is used because it looks useful or well written.\n"
              "Also check for: methods marked `[Obsolete]` that are still present; code after an "
              "unconditional `return` statement (unreachable); duplicate implementations where a "
              "fixed version exists alongside a broken one but only the broken one is called; "
              "`throw new NotImplementedException()` in non-stub code.\n\n"
              "### 7. Magic Strings and Numbers\n"
              "Check for: numeric literals used inline without a named constant (e.g. fee rates, page size limits, "
              "deposit caps, string length limits); string literals for email addresses, role names, or config keys "
              "repeated in multiple places; values that belong in configuration (e.g. `appsettings.json`) but are "
              "hardcoded in source.\n\n"
              "### 8. Anti-patterns and Code Quality\n"
              "Check for: string concatenation inside a loop (O(n²) — use `StringBuilder` or `string.Join`); "
              "`new Regex(...)` inside a method called repeatedly (should be `static readonly`); shared mutable "
              "static state accessed from multiple threads without synchronization; reimplementing standard library "
              "methods that already exist (e.g. `string.IsNullOrWhiteSpace`); helper methods designed to leak "
              "resource ownership to callers with no documented contract; duplicated validation logic that should "
              "be extracted to a shared method (report it once per method that repeats the block, naming each).\n"
              "Also report refactoring opportunities: any method whose body carries three or more distinct "
              "responsibilities that would be clearer and more testable split into named private helpers -- "
              "name the method and say which responsibilities you would separate.\n\n"
              "### 9. Configuration Issues\n"
              "Check for: `UseDeveloperExceptionPage()` called unconditionally; `ValidateLifetime = false` on JWT; "
              "HTTPS redirection commented out; overly permissive CORS (`AllowAnyOrigin` + `AllowAnyMethod`); "
              "debug log levels set for production namespaces; outdated or vulnerable NuGet packages (check `.csproj`); "
              "missing environment-specific config overrides (`appsettings.Production.json`).\n\n"
              "### 10. Missing Unit Tests\n"
              "Check whether a test project exists. If not, list the specific methods and scenarios that are most "
              "critical to test, focusing on boundary conditions, auth flows, financial calculations, and pagination.\n\n"
              "---\n\n"
              "## Output Format\n\n"
              "Produce a Markdown report with one `##` section per category above.\n"
              "**You MUST include all 10 sections.** If a category has no issues, write 'No issues found.'\n\n"
              "Within each section use a Markdown table with columns:\n"
              "| File | Line | Issue | Fix |\n"
              "Keep each CELL to one sentence — no code blocks, no nested bullets. That limit applies "
              "to the width of a cell, NOT to the number of rows.\n"
              "Give every occurrence its own row, and name the specific method, field or symbol it "
              "concerns. Do not merge several occurrences into one summary row such as "
              "\'several methods build SQL by interpolation\' -- list each method separately. Do not "
              "end a section early because the pattern has been illustrated: a reader must be able to "
              "act on each row without going back to the source to find the other instances.\n"
              "Thoroughness matters more than length here. You have ample output budget; a section "
              "with fifteen genuine rows is better than the same section trimmed to five.\n\n"
              "Complete all 10 sections before adding any additional commentary.\n\n"
              "---\n\n"
              "## Source Files\n\n"
              "{diff}"
          )
          # Measure instruction overhead (template without the diff) to correctly
          # budget the remaining chars for source code. Code averages ~2.5 chars/token.
          # Reserve tokens for: instructions overhead + response (num_predict) + safety buffer.
          chars_per_token = 2.5
          instruction_chars = len(prompt_template.format(
              branch_name=branch_name, commit_sha=commit_sha, diff="", truncation_note=""))
          available_tokens = num_ctx_tokens - num_predict_tokens - 500  # 500 token safety buffer
          max_diff_chars = max(0, int(available_tokens * chars_per_token) - instruction_chars)
          truncated = len(diff) > max_diff_chars
          if truncated:
              diff = diff[:max_diff_chars]
              truncation_note = "[Note: the source listing below was truncated to fit the context window]"

          print(f"Context: {num_ctx_tokens} tokens, instruction overhead: {instruction_chars} chars, "
                f"diff budget: {max_diff_chars} chars, actual diff: {len(diff)} chars, truncated: {truncated}")

          prompt = prompt_template.format(
              branch_name=branch_name,
              commit_sha=commit_sha,
              diff=diff,
              truncation_note=truncation_note,
          )

          num_predict = num_predict_tokens
          temperature = float(os.environ.get("AI_ASSISTANT_MODEL_TEMPERATURE", "0.3"))
          options = {
              "temperature": temperature,
              "num_predict": num_predict,
              "num_ctx": num_ctx_tokens,
          }
          # Optional per-model sampler overrides. Left unset, whatever the model
          # Modelfile declares applies -- for Muse-Glimmer-30B that is top_p 0.95 and
          # top_k 64, which combined with the harness default temperature of 0.3 is
          # neither the model card config nor a clean deterministic one. Setting both
          # here makes the effective sampler independent of the server-side Modelfile.
          _top_p = os.environ.get("AI_ASSISTANT_MODEL_TOP_P", "").strip()
          _top_k = os.environ.get("AI_ASSISTANT_MODEL_TOP_K", "").strip()
          if _top_p:
              options["top_p"] = float(_top_p)
          if _top_k:
              options["top_k"] = int(_top_k)

          payload = {
              "model": model,
              "messages": [{"role": "user", "content": prompt}],
              "stream": False,
              "options": options,
          }

          print(f"Sampler: temperature={temperature} "
                f"top_p={options.get('top_p', '(model default)')} "
                f"top_k={options.get('top_k', '(model default)')}")

          with open("payload.json", "w") as f:
              json.dump(payload, f)

          print(f"Calling {base_url}/api/chat with model {model} …")

          result = subprocess.run(
              [
                  "curl", "-s", "--show-error", "--fail-with-body", "--max-time", "7200",
                  "-X", "POST", f"{base_url}/api/chat",
                  "-H", "Content-Type: application/json",
                  "-d", "@payload.json",
              ],
              capture_output=True,
              text=True,
          )

          if result.returncode != 0:
              print(
                  f"ERROR: curl failed (exit {result.returncode})\n"
                  f"stderr: {result.stderr}\n"
                  f"body  : {result.stdout[:2000]}",
                  file=sys.stderr,
              )
              sys.exit(1)

          try:
              data = json.loads(result.stdout)
          except json.JSONDecodeError as exc:
              print(f"ERROR: Could not parse Ollama response: {exc}", file=sys.stderr)
              print(f"Raw output (first 500 chars): {result.stdout[:500]}", file=sys.stderr)
              sys.exit(1)

          import re as _re
          _think_re = _re.compile(r"<think>.*?</think>\s*", _re.DOTALL | _re.IGNORECASE)
          _msg = data.get("message") or {}
          # Ollama >= 0.9 returns reasoning in message.thinking rather than as inline
          # <think> tags. Those tokens still count toward eval_count / num_predict, so
          # a model can exhaust its output budget while returning empty content.
          thinking = _msg.get("thinking") or ""
          review = _think_re.sub("", _msg.get("content", "")).strip()
          print(f"Response: content={len(review)} chars, thinking={len(thinking)} chars, "
                f"eval_count={data.get('eval_count')}, done_reason={data.get('done_reason')}")
          if not review:
              print(
                  f"ERROR: Ollama returned no content. thinking={len(thinking)} chars, "
                  f"eval_count={data.get('eval_count')}, done_reason={data.get('done_reason')}. "
                  "If thinking is large and done_reason is 'length', raise "
                  "AI_ASSISTANT_MODEL_NUM_PREDICT -- and raise AI_ASSISTANT_MODEL_NUM_CTX "
                  "with it, or the source budget shrinks silently.",
                  file=sys.stderr,
              )
              sys.exit(1)

          with open("review.md", "w") as f:
              f.write(review)

          def _ns_to_s(ns):
              return round(ns / 1e9, 1) if ns else 0.0
          def _tps(tokens, duration_ns):
              return round(tokens / max(duration_ns / 1e9, 0.001), 1) if tokens and duration_ns else 0.0

          review_metrics = {
              "model": model,
              "temperature": temperature,
              "top_p": options.get("top_p"),
              "top_k": options.get("top_k"),
              "total_duration_s": _ns_to_s(data.get("total_duration")),
              "load_duration_s": _ns_to_s(data.get("load_duration")),
              "prompt_tokens": data.get("prompt_eval_count", 0),
              "output_tokens": data.get("eval_count", 0),
              "output_token_limit": num_predict_tokens,
              "content_chars": len(review),
              "thinking_chars": len(thinking),
              "prompt_tps": _tps(data.get("prompt_eval_count"), data.get("prompt_eval_duration")),
              "output_tps": _tps(data.get("eval_count"), data.get("eval_duration")),
              "context_window": num_ctx_tokens,
              "context_utilization_pct": round(
                  (data.get("prompt_eval_count", 0) + data.get("eval_count", 0)) / num_ctx_tokens * 100, 1
              ),
              "content_truncated": truncated,
              "done_reason": data.get("done_reason", ""),
          }
          with open("metrics.json", "w") as mf:
              json.dump({"review": review_metrics}, mf, indent=2)

          print(f"Review metrics: {review_metrics['total_duration_s']}s total | "
                f"prompt {review_metrics['prompt_tokens']:,} tok @ {review_metrics['prompt_tps']} tok/s | "
                f"output {review_metrics['output_tokens']:,} tok @ {review_metrics['output_tps']} tok/s | "
                f"context {review_metrics['context_utilization_pct']}% used | "
                f"done_reason={review_metrics['done_reason']}")
          print("Review saved to review.md")
          PYEOF

      # -----------------------------------------------------------------------
      # Score the review against every known issue in ISSUES.md.
      # A second Ollama call receives both the review and the issues reference
      # and produces a scorecard table (Found / Partial / Missed per issue ID).
      # -----------------------------------------------------------------------
      - name: Score review against ISSUES.md
        if: steps.diff.outputs.empty == 'false'
        env:
          SCORECARD_MODEL: ${{ vars.AI_ASSISTANT_OLLAMA_MODEL_REVIEWER }}
          # enforce = downgrade ungrounded Found/Partial rows to Missed (default)
          # warn    = log them but leave the scorecard untouched
          # off     = skip the check entirely (use when reproducing an archived run)
          AI_ASSISTANT_SCORECARD_GROUNDING: ${{ vars.AI_ASSISTANT_SCORECARD_GROUNDING || 'enforce' }}
          AI_ASSISTANT_MODEL_NUM_PREDICT: 24000
          # The scorer is the measuring instrument: keep it pinned low and unchanged
          # even when the review sampler is retuned, or scores stop being comparable.
          AI_ASSISTANT_SCORER_TEMPERATURE: ${{ vars.AI_ASSISTANT_SCORER_TEMPERATURE || '0.3' }}
          BRANCH_NAME: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          python3 - <<'PYEOF'
          import json, os, re, subprocess, sys

          model = os.environ.get("SCORECARD_MODEL", os.environ.get("OLLAMA_MODEL"))
          base_url = os.environ.get("OLLAMA_URL")
          branch_name = os.environ.get("BRANCH_NAME", "(unknown branch)")
          commit_sha = os.environ.get("COMMIT_SHA", "(unknown commit)")

          with open("review.md", "r", errors="replace") as f:
              review = f.read()

          with open("ISSUES.md", "r", errors="replace") as f:
              issues = f.read()

          preamble = (
              "You are a QA evaluator assessing how well an AI code review tool performed.\n\n"
              "CRITICAL: The AI review was produced by a model that has NEVER seen the reference "
              "issue list. It will NOT use issue IDs like C1 or L2. It will describe problems in "
              "its own words. Your job is STRICT semantic matching: for each reference issue you "
              "must locate a specific sentence in the review that names the SAME target — the same "
              "file, the same method or symbol, or the same concrete behavior described in the "
              "reference Description. If you cannot locate such a sentence, the issue is Missed. "
              "Wording differences are fine; target differences are NOT.\n\n"
              "Scoring rules (apply strictly, with evidence):\n"
              "- Found: the review identifies THIS specific issue. There must exist a sentence in "
              "the review that names the same method/file/symbol/behavior as the Description. "
              "Generic class-level mentions are NOT enough when the Description names a specific "
              "target. Each Found rating must be backed by its OWN sentence — you cannot reuse one "
              "sentence to mark multiple unrelated rows Found.\n"
              "  Concretely:\n"
              "  * SQL-injection rows C1, C4, C5, C6, C7 each name a different method (Login, "
              "UpdateUser/DeleteUser, SearchUsers, Transfer/Deposit, RecordTransaction). Found "
              "requires the review to mention THAT method or its specific parameters. A generic "
              "'SQL injection exists' sentence credits AT MOST one of these — the others are Partial.\n"
              "  * Dead-code rows D1-D11 each name a different unused symbol (HashPasswordSha1, "
              "ValidateToken's unreachable code, TableExists, ExecuteQueryWithParams, "
              "BuildHtmlTemplate, SendWelcomeEmailHtml, FormatCurrency, IsWithinDailyLimit, "
              "ObfuscateAccount, ToTitleCase, JoinWithSeparatorFixed). Found requires the review "
              "to name THAT symbol. 'Dead code exists' or naming ONE unused method does not credit "
              "the others — those are Missed.\n"
              "  * Access-control rows C10, C11, L5, E7, N7 each name a different missing check. "
              "'ValidateToken returns true' is NOT evidence for any of them — it covers ONLY D2 "
              "(unreachable code). Found requires the review to name the specific endpoint or "
              "missing check.\n"
              "  * C2 (backdoor password constant 'AdminBypassPassword') and C8 (production "
              "secrets in appsettings.json) and CF1 (secrets in source control) are RELATED but "
              "DISTINCT. The review must name AdminBypassPassword to credit C2; a generic "
              "'hardcoded credentials' sentence credits C8 or CF1 but not C2.\n"
              "- Partial: the review touches the right area but materially misses the specific "
              "point. Examples: mentions MD5 is weak but not the missing salt (C3); mentions SQL "
              "injection generally but not the specific method named in the row; mentions "
              "hardcoded values broadly but not the specific constant in the row.\n"
              "- Missed: the review does not identify this specific issue. After careful reading, "
              "you cannot quote a sentence that addresses THIS row's specific target. Phrasing "
              "differences are fine — semantic match is required, but the semantic TARGET "
              "(method/symbol/file/behavior) must be the same. DO NOT default to Found when in "
              "doubt — default to Missed if you cannot point to specific evidence.\n\n"
              "Evidence rule for the Notes column (NON-NEGOTIABLE):\n"
              "- For every Found or Partial rating, the Note must quote or closely paraphrase the "
              "supporting sentence and MUST name the same target (method/file/symbol/behavior) as "
              "THIS row's Description. If your Note text names a different target than the "
              "Description, the rating is wrong — downgrade to Missed.\n"
              "- Self-check before finalizing each row: read your Note next to the row's "
              "Description. Do they refer to the same specific thing? If not, change Status to "
              "Missed and clear the Note.\n"
              "- Do not reuse identical Note text across multiple IDs. Each row needs independent "
              "evidence drawn from a different part of the review.\n\n"
              "Your task:\n"
              "- Work through EVERY issue ID in the reference document: C1-C11, L1-L5, R1-R3, "
              "E1-E7, RL1-RL5, N1-N7, M1-M5, D1-D11, A1-A6, CF1-CF9 (69 rows), plus ONE aggregate "
              "row for the entire '## Missing Unit Tests' prose section (see below).\n"
              "- Output a Markdown document titled '# AI Review Scorecard' with:\n"
              "  1. Exactly ONE summary line of the form: "
              "Total: <N> Found / <P> Partial / <M> Missed out of <T> issues.\n"
              "     N, P, and M MUST be computed ONLY by counting Status cells across ALL of your "
              "tables after every row is written; T must equal N+P+M (the same as the number of "
              "data rows in those tables). If your draft counts disagree with the tables, fix "
              "either the tables or the summary before you stop — never leave contradictory numbers.\n"
              "  2. One table per category matching the categories in the reference document.\n"
              "     Each table must have columns: | ID | Description | Status | Notes |\n"
              "     Use EXACTLY those four columns — do not insert an extra file/location column "
              "between ID and Description (ISSUES.md already embeds file and lines inside the "
              "Description text). Extra columns break automated counting; Notes may contain `|` "
              "characters, so keep pipe delimiters only between the four columns.\n"
              "     Status must be exactly one of: Found | Partial | Missed\n"
              "     Notes: one sentence quoting or closely paraphrasing the relevant part of the "
              "review, or blank if Missed. If Status is Found or Partial, the Note must clearly "
              "relate to THAT row's Description (same vulnerability, bug, or symbol named there). "
              "Reusing the same Note text for multiple different IDs is invalid — use Partial or "
              "Missed instead for rows the review does not actually cover.\n"
              "     Concretely: for dead-code rows D1-D11, each Found/Partial Note must mention "
              "that row's specific unused symbol or scenario (e.g. D1 → HashPasswordSha1, D4 → "
              "ExecuteQueryWithParams). Copy-pasting one JoinWithSeparator sentence for every "
              "D-row is wrong. Likewise, do not paste one SmtpClient or Transfer paragraph "
              "under unrelated SQL-injection or pagination IDs.\n"
              "  3. Row-count rules (strict):\n"
              "     - You must output EXACTLY 70 data rows across all tables: one row per ID "
              "C1 through CF9 (69 rows), matching the reference tables in ISSUES.md, plus EXACTLY "
              "ONE row for Missing Unit Tests.\n"
              "     - For Missing Unit Tests ONLY: use a single row with ID **UT**. In the "
              "Description cell, briefly summarize the whole section (no test project / missing "
              "coverage and the key areas listed in ISSUES.md). Score whether the review addresses "
              "that aggregate topic (missing tests, need for coverage, etc.).\n"
              "     - Do NOT add multiple rows for Missing Unit Tests (no one-row-per-bullet, no "
              "rows with ID '-' listing individual test scenarios). Do NOT add extra IDs beyond "
              "C1-CF9 and UT.\n"
              "- Do not add any commentary outside the scorecard document.\n\n"
              "---\n"
              "## Reference Issues\n\n"
          )

          num_ctx = int(os.environ.get("AI_ASSISTANT_MODEL_NUM_CTX", "32768"))
          num_predict = int(os.environ.get("AI_ASSISTANT_MODEL_NUM_PREDICT", "16384"))
          temperature = float(os.environ.get("AI_ASSISTANT_SCORER_TEMPERATURE", "0.3"))

          # Truncate the review if the full prompt would exceed the context window.
          # Code tokenizes at ~2-3 chars/token; multiply by 2 to stay safe.
          max_chars = num_ctx * 2
          full_prompt = preamble + issues + "\n\n---\n## AI Review Output\n\n" + review + "\n"
          if len(full_prompt) > max_chars:
              overhead = len(preamble) + len(issues) + 50
              review = review[: max(0, max_chars - overhead)]
          scoring_prompt = preamble + issues + "\n\n---\n## AI Review Output\n\n" + review + "\n"

          payload = {
              "model": model,
              "messages": [{"role": "user", "content": scoring_prompt}],
              "stream": False,
              "options": {
                  "temperature": temperature,
                  "num_predict": num_predict,
                  "num_ctx": num_ctx,
              },
          }

          with open("scoring_payload.json", "w") as f:
              json.dump(payload, f)

          review_model = os.environ.get("OLLAMA_MODEL")
          print(f"Scoring with {model} (review was by {review_model}) …")

          result = subprocess.run(
              [
                  "curl", "-s", "--show-error", "--fail-with-body", "--max-time", "7200",
                  "-X", "POST", f"{base_url}/api/chat",
                  "-H", "Content-Type: application/json",
                  "-d", "@scoring_payload.json",
              ],
              capture_output=True,
              text=True,
          )

          if result.returncode != 0:
              print(
                  f"ERROR: curl failed (exit {result.returncode})\n"
                  f"stderr: {result.stderr}\n"
                  f"body  : {result.stdout[:2000]}",
                  file=sys.stderr,
              )
              sys.exit(1)

          try:
              data = json.loads(result.stdout)
          except json.JSONDecodeError as exc:
              print(f"ERROR: Could not parse Ollama response: {exc}", file=sys.stderr)
              print(f"Raw output (first 500 chars): {result.stdout[:500]}", file=sys.stderr)
              sys.exit(1)

          _think_re = re.compile(r"<think>.*?</think>\s*", re.DOTALL | re.IGNORECASE)
          scorecard = _think_re.sub("", (data.get("message") or {}).get("content", "")).strip()
          if not scorecard:
              print("ERROR: Ollama returned an empty scorecard response.", file=sys.stderr)
              sys.exit(1)

          # Workflow prepends its own H1 + branch/commit line; drop duplicate title from model.
          scorecard = re.sub(
              r"^#\s*AI\s+Review\s+Scorecard\s*\n+",
              "",
              scorecard,
              count=1,
              flags=re.IGNORECASE,
          ).lstrip()

          _STATUS_CELL = re.compile(r"\|\s*(Found|Partial|Missed)\s*\|", re.IGNORECASE)
          _ROW_ID = re.compile(r"^\|\s*\*{0,2}([A-Z]{1,3}\d*|UT)\*{0,2}\s*\|", re.IGNORECASE)

          # Minimum fraction of a Note's content words that must appear in a single
          # line of the review for that Note to count as evidence. Tuned against run
          # #133, where the scorer invented three quotes by copying ISSUES.md wording
          # verbatim (D6 scored 0.43, N4 0.33, D10 0.17) while every legitimate row
          # scored >= 0.55.
          _GROUNDING_MIN = 0.5
          # Fallback for Notes that legitimately summarise several review lines at once
          # (the aggregate UT row, or a Note citing two findings). A Note can clear the
          # check on whole-review vocabulary alone, but only at a much higher bar.
          _GROUNDING_VOCAB_MIN = 0.8
          _QUOTED = re.compile(r'"([^"]{4,})"')
          _STOPWORDS = frozenset(
              "the a an is are was were be been in on of to and or for with without not "
              "no this that it its as at by from than then so if but review mentions "
              "does doesn specifically name named issue context".split()
          )

          def _content_words(text: str) -> set:
              text = re.sub(r"[^a-z0-9_]+", " ", text.lower())
              return {w for w in text.split() if len(w) > 2 and w not in _STOPWORDS}

          def _evidence_text(note: str) -> str:
              """Isolate the quoted evidence inside a Note.

              Scorers commonly write: "file" line N: "quoted finding" - explanation of
              what it does or does not cover. That trailing explanation is drawn from
              the reference issue, not the review, so matching the whole Note punishes
              correctly-evidenced rows. Match the quoted spans when there are any.
              """
              quoted = " ".join(_QUOTED.findall(note))
              return quoted if len(_content_words(quoted)) >= 3 else note

          def drop_duplicate_ids(md: str) -> str:
              """Keep the first row per issue ID; models sometimes emit an ID twice
              with contradictory statuses, which inflates the denominator."""
              seen, out, dropped = {}, [], []
              for line in md.splitlines():
                  m_id = _ROW_ID.match(line.strip())
                  m = _STATUS_CELL.search(line)
                  if m_id and m:
                      rid = m_id.group(1).upper()
                      status = m.group(1).capitalize()
                      if rid in seen:
                          dropped.append((rid, seen[rid], status))
                          continue
                      seen[rid] = status
                  out.append(line)
              for rid, kept, dup in dropped:
                  print(
                      f"WARN: duplicate scorecard row for {rid} "
                      f"(kept '{kept}', dropped '{dup}').",
                      file=sys.stderr,
                  )
              return "\n".join(out)

          def enforce_note_grounding(md: str, review_text: str, mode: str):
              """Downgrade Found/Partial rows whose Notes are not supported by the review.

              The scorer is asked to quote the review, but it can instead paraphrase the
              reference issue back at us -- producing confident evidence for text the
              review never contained. Comparing each Note against the review the scorer
              actually received catches that mechanically.
              """
              if mode == "off":
                  return md, []
              spans = [_content_words(l) for l in review_text.splitlines() if l.strip()]
              spans = [s for s in spans if s]
              if not spans:
                  print("WARN: review has no comparable text; skipping grounding check.",
                        file=sys.stderr)
                  return md, []
              review_vocab = set().union(*spans)

              out, downgraded = [], []
              for line in md.splitlines():
                  m_id = _ROW_ID.match(line.strip())
                  m = _STATUS_CELL.search(line)
                  if not m_id or not m:
                      out.append(line)
                      continue
                  status = m.group(1).capitalize()
                  if status == "Missed":
                      out.append(line)
                      continue
                  note_words = _content_words(_evidence_text(line[m.end():].lstrip("|")))
                  if len(note_words) < 3:
                      out.append(line)
                      continue
                  best = max(len(note_words & s) / len(note_words) for s in spans)
                  vocab = len(note_words & review_vocab) / len(note_words)
                  if best >= _GROUNDING_MIN or vocab >= _GROUNDING_VOCAB_MIN:
                      out.append(line)
                      continue
                  rid = m_id.group(1).upper()
                  downgraded.append((rid, status, round(best, 2)))
                  if mode == "enforce":
                      line = (line[: m.start()]
                              + "| Missed | _(ungrounded: no matching sentence in review)_ |")
                  out.append(line)

              if downgraded:
                  verb = "Downgraded" if mode == "enforce" else "Would downgrade"
                  print(
                      f"WARN: {verb} {len(downgraded)} scorecard row(s) whose Notes are not "
                      f"supported by review.md: "
                      + ", ".join(f"{r}({s}, overlap {b})" for r, s, b in downgraded),
                      file=sys.stderr,
                  )
              return "\n".join(out), downgraded

          def count_table_statuses(md: str) -> tuple[int, int, int]:
              """Count Found / Partial / Missed from scorecard tables.

              Rows must be | ID | Description | Status | Notes | but models sometimes insert an
              extra column (e.g. file path) or put pipes inside Notes. Naive split("|") then mis-
              classifies Status. We detect the Status column by the first | Found|Partial|Missed |
              marker, which precedes the Notes cell (even when Notes contains additional pipes).
              """
              found = partial = missed = 0
              for raw in md.splitlines():
                  line = raw.strip()
                  if not line.startswith("|"):
                      continue
                  parts = [p.strip() for p in line.split("|")]
                  if len(parts) < 3:
                      continue
                  id_cell = parts[1] if len(parts) > 1 else ""
                  if id_cell.lower() == "id" or not id_cell:
                      continue
                  # Markdown separator row (first cell is ---)
                  if re.match(r"^-{3,}$", id_cell):
                      continue
                  m = _STATUS_CELL.search(line)
                  if not m:
                      continue
                  s = m.group(1).lower()
                  if s == "found":
                      found += 1
                  elif s == "partial":
                      partial += 1
                  elif s == "missed":
                      missed += 1
              return found, partial, missed

          def warn_repeated_notes(md: str) -> None:
              """Emit WARN when the scorer pasted identical Notes for many distinct issue IDs."""
              from collections import defaultdict

              note_to_ids = defaultdict(list)
              for raw in md.splitlines():
                  line = raw.strip()
                  if not line.startswith("|"):
                      continue
                  m_id = _ROW_ID.match(line)
                  if not m_id:
                      continue
                  issue_id = m_id.group(1).upper()
                  if issue_id == "ID":
                      continue
                  if re.match(r"^-{3,}$", issue_id):
                      continue
                  m = _STATUS_CELL.search(line)
                  if not m:
                      continue
                  status = m.group(1).lower()
                  if status not in ("found", "partial"):
                      continue
                  notes = line[m.end() :].lstrip("|").strip()
                  if len(notes) < 20:
                      continue
                  norm = re.sub(r"\s+", " ", notes).strip().lower()
                  note_to_ids[norm].append(issue_id)

              for norm, ids in note_to_ids.items():
                  if len(ids) >= 3:
                      uniq = sorted(set(ids), key=lambda x: (len(x), x))
                      preview = norm[:140] + ("…" if len(norm) > 140 else "")
                      print(
                          "WARN: Scorecard reused the same Notes text for "
                          f"{len(uniq)} issues ({', '.join(uniq)}). "
                          "Scorer model ignored per-issue Notes rules; compare review.md. "
                          f"Example: {preview!r}",
                          file=sys.stderr,
                      )

          def reconcile_summary_line(md: str) -> str:
              fnd, prt, mis = count_table_statuses(md)
              total = fnd + prt + mis
              if total == 0:
                  print("WARN: Could not parse any table Status cells; leaving model summary unchanged.")
                  return md
              new_line = f"Total: {fnd} Found / {prt} Partial / {mis} Missed out of {total} issues."
              pattern = re.compile(
                  r"^Total:\s*\d+\s*Found\s*/\s*\d+\s*Partial\s*/\s*\d+\s*Missed\s*out\s*of\s*\d+\s*issues\.?\s*$",
                  re.MULTILINE | re.IGNORECASE,
              )
              md2, n = pattern.subn(new_line, md, count=1)
              if n:
                  print(f"Scorecard summary reconciled from tables: {new_line}")
                  return md2
              # No matching summary line — insert machine-derived counts after the first line.
              insert = "\n" + new_line + "\n"
              first_nl = md.find("\n")
              if first_nl != -1:
                  return md[: first_nl + 1] + insert + md[first_nl + 1 :]
              return insert + md

          header = (
              f"# AI Review Scorecard\n\n"
              f"> **Branch:** `{branch_name}` &nbsp;·&nbsp; **Commit:** `{commit_sha[:7]}`\n\n"
          )

          grounding_mode = os.environ.get("AI_ASSISTANT_SCORECARD_GROUNDING", "enforce").strip().lower()
          if grounding_mode not in ("enforce", "warn", "off"):
              print(f"WARN: unknown grounding mode {grounding_mode!r}; using 'enforce'.",
                    file=sys.stderr)
              grounding_mode = "enforce"

          body = drop_duplicate_ids(scorecard)
          body, grounding_downgrades = enforce_note_grounding(body, review, grounding_mode)
          # Recount only after dedupe and downgrades, so the summary matches the tables.
          body = reconcile_summary_line(body)
          warn_repeated_notes(body)
          rf, rp, rm = count_table_statuses(body)
          row_total = rf + rp + rm
          if row_total != 70:
              print(
                  f"WARN: Scorecard has {row_total} table data rows; expected exactly 70 "
                  f"(69 IDs C1-CF9 plus one UT row for Missing Unit Tests).",
                  file=sys.stderr,
              )

          with open("issues_scorecard.md", "w") as f:
              f.write(header + body)

          def _ns_to_s(ns):
              return round(ns / 1e9, 1) if ns else 0.0
          def _tps(tokens, duration_ns):
              return round(tokens / max(duration_ns / 1e9, 0.001), 1) if tokens and duration_ns else 0.0

          scoring_metrics = {
              "model": model,
              "total_duration_s": _ns_to_s(data.get("total_duration")),
              "load_duration_s": _ns_to_s(data.get("load_duration")),
              "prompt_tokens": data.get("prompt_eval_count", 0),
              "output_tokens": data.get("eval_count", 0),
              "prompt_tps": _tps(data.get("prompt_eval_count"), data.get("prompt_eval_duration")),
              "output_tps": _tps(data.get("eval_count"), data.get("eval_duration")),
              "done_reason": data.get("done_reason", ""),
          }
          score_result = {
              "found": rf, "partial": rp, "missed": rm,
              "total": row_total,
              "score_pct": round(rf / max(row_total, 1) * 100, 1),
              "grounding_mode": grounding_mode,
              "grounding_downgrades": len(grounding_downgrades),
              "grounding_downgraded_ids": [r for r, _s, _b in grounding_downgrades],
          }
          try:
              with open("metrics.json") as mf:
                  all_metrics = json.load(mf)
          except (FileNotFoundError, json.JSONDecodeError):
              all_metrics = {}
          all_metrics["scoring"] = scoring_metrics
          all_metrics["score"] = score_result
          all_metrics["combined_total_s"] = round(
              all_metrics.get("review", {}).get("total_duration_s", 0.0) +
              scoring_metrics["total_duration_s"], 1
          )
          with open("metrics.json", "w") as mf:
              json.dump(all_metrics, mf, indent=2)

          print(f"Scoring metrics: {scoring_metrics['total_duration_s']}s total | "
                f"output {scoring_metrics['output_tokens']:,} tok @ {scoring_metrics['output_tps']} tok/s | "
                f"done_reason={scoring_metrics['done_reason']}")
          print(f"Combined review + scoring: {all_metrics['combined_total_s']}s")
          print("Scorecard saved to issues_scorecard.md")
          PYEOF

      # -----------------------------------------------------------------------
      # Generate a human-readable metrics.md from metrics.json
      # -----------------------------------------------------------------------
      - name: Generate metrics report
        if: steps.diff.outputs.empty == 'false'
        env:
          BRANCH_NAME: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          python3 - <<'PYEOF'
          import json, os

          branch_name = os.environ.get("BRANCH_NAME", "")
          commit_sha  = os.environ.get("COMMIT_SHA", "")
          run_number  = os.environ.get("RUN_NUMBER", "")

          try:
              with open("metrics.json") as f:
                  m = json.load(f)
          except (FileNotFoundError, json.JSONDecodeError) as exc:
              print(f"No metrics.json found ({exc}); skipping metrics report.")
              raise SystemExit(0)

          r  = m.get("review", {})
          s  = m.get("scoring", {})
          sc = m.get("score", {})
          combined = m.get("combined_total_s", 0)

          def fmt_s(secs):
              if secs >= 60:
                  return f"{int(secs // 60)}m {secs % 60:.0f}s"
              return f"{secs:.1f}s"

          out_tokens   = r.get("output_tokens", 0)
          out_limit    = r.get("output_token_limit", 0)
          done_review  = r.get("done_reason", "")
          done_scoring = s.get("done_reason", "")
          truncated    = r.get("content_truncated", False)

          def _samp(key, label):
              v = r.get(key)
              return f"{label} {v}" if v is not None else f"{label} (model default)"

          sampler = ", ".join([
              f"temp {r.get('temperature', '?')}",
              _samp("top_p", "top_p"),
              _samp("top_k", "top_k"),
          ])

          lines = [
              "# AI Model Performance Metrics\n",
              f"> **Branch:** `{branch_name}` &nbsp;·&nbsp; "
              f"**Commit:** `{commit_sha[:7]}` &nbsp;·&nbsp; **Run:** #{run_number}\n",
              "",
              "## Score",
              f"Total: {sc.get('found','?')} Found / {sc.get('partial','?')} Partial / "
              f"{sc.get('missed','?')} Missed out of {sc.get('total','?')} issues "
              f"({sc.get('score_pct','?')}% Found)",
              "",
              f"Scorer grounding: {sc.get('grounding_mode','?')} mode, "
              f"{sc.get('grounding_downgrades', 0)} row(s) downgraded for unsupported evidence"
              + (f" ({', '.join(sc.get('grounding_downgraded_ids', []))})"
                 if sc.get('grounding_downgraded_ids') else ""),
              "",
              "## Review Performance",
              f"**Model:** `{r.get('model','?')}`\n",
              "| Metric | Value |",
              "|--------|-------|",
              f"| Total time | {fmt_s(r.get('total_duration_s', 0))} |",
              f"| Model load time | {fmt_s(r.get('load_duration_s', 0))} |",
              f"| Inference time | {fmt_s(r.get('total_duration_s', 0) - r.get('load_duration_s', 0))} |",
              f"| Sampler | {sampler} |",
              f"| Prompt tokens | {r.get('prompt_tokens', 0):,} |",
              f"| Output tokens | {out_tokens:,} of {out_limit:,} limit |",
              f"| Answer / reasoning split | {r.get('content_chars', 0):,} chars answer, "
              f"{r.get('thinking_chars', 0):,} chars reasoning |",
              f"| Output speed | {r.get('output_tps', 0)} tok/s |",
              f"| Prompt speed | {r.get('prompt_tps', 0)} tok/s |",
              f"| Context window | {r.get('context_window', 0):,} tokens |",
              f"| Context utilization | {r.get('context_utilization_pct', 0)}% |",
              f"| Content truncated | {'**Yes ⚠**' if truncated else 'No'} |",
              f"| Completed naturally | {'No ⚠ (hit token limit)' if done_review == 'length' else 'Yes'} |",
              "",
              "## Scoring Performance",
              f"**Model:** `{s.get('model','?')}`\n",
              "| Metric | Value |",
              "|--------|-------|",
              f"| Total time | {fmt_s(s.get('total_duration_s', 0))} |",
              f"| Model load time | {fmt_s(s.get('load_duration_s', 0))} |",
              f"| Prompt tokens | {s.get('prompt_tokens', 0):,} |",
              f"| Output tokens | {s.get('output_tokens', 0):,} |",
              f"| Output speed | {s.get('output_tps', 0)} tok/s |",
              f"| Prompt speed | {s.get('prompt_tps', 0)} tok/s |",
              f"| Completed naturally | {'No ⚠ (hit token limit)' if done_scoring == 'length' else 'Yes'} |",
              "",
              "## Combined",
              "| Metric | Value |",
              "|--------|-------|",
              f"| Review + scoring time | {fmt_s(combined)} |",
          ]

          with open("metrics.md", "w") as f:
              f.write("\n".join(lines) + "\n")

          print("Metrics report saved to metrics.md")
          PYEOF

      # -----------------------------------------------------------------------
      # Print the scorecard to the workflow log so it is visible without
      # navigating away from the Actions run page.
      # -----------------------------------------------------------------------
      - name: Print scorecard to workflow log
        if: steps.diff.outputs.empty == 'false'
        run: |
          echo "======================================================================"
          echo "  PERFORMANCE METRICS"
          echo "======================================================================"
          cat metrics.md
          echo ""
          echo "======================================================================"
          echo "  ISSUES.md SCORECARD"
          echo "======================================================================"
          cat issues_scorecard.md
          echo ""
          echo "======================================================================"
          echo "  AI REVIEW"
          echo "======================================================================"
          cat review.md

      # -----------------------------------------------------------------------
      # Upload review, scorecard, and metrics as one downloadable artifact
      # -----------------------------------------------------------------------
      - name: Upload AI review artifact
        if: steps.diff.outputs.empty == 'false'
        uses: actions/upload-artifact@v7
        with:
          name: ai-review-${{ github.ref_name }}-${{ github.run_number }}
          path: |
            review.md
            issues_scorecard.md
            metrics.md
            metrics.json
          retention-days: 90
